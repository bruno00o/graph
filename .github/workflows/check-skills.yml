name: Check Skills

on:
  pull_request: {}
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: TanStack/intent/.github/workflows/check-skills.yml@b9f205d69ba2bec93954508ff76281ae2178062c
    with:
      artifacts: "_artifacts"
      repair: true
      node-version: "24.22.1"

  review:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: TanStack/intent/.github/workflows/review-skills.yml@b9f205d69ba2bec93954508ff76281ae2178062c
    with:
      package-label: "@bruno00o/graph"
      node-version: "24.22.1"
