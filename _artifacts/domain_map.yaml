library:
  name: "@bruno00o/graph"
  version: 0.22.0
  repository: https://github.com/bruno00o/graph
  description: Typed graph visualization for any framework, rendered with WebGL2.
  primary_framework: framework-agnostic
domains:
  - name: Graph setup
    slug: graph-setup
    description: Data, keys, marks, the definition, mounting, the instance, states, events and data updates, in plain TypeScript and in React.
  - name: Appearance
    slug: appearance
    description: How nodes, labels and edges look, from scales and themes to edge ends, waypoints, bundling and routing.
  - name: Structure
    slug: structure
    description: The shape of the graph beyond nodes and edges, with groups, merged and hidden elements, layers, support and paths.
  - name: Placement
    slug: placement
    description: Where nodes go, with layouts, positions from data or code, and saved positions.
  - name: Navigation and input
    slug: navigation-and-input
    description: The view, zoom ranges, selection, gestures, keyboard and the states driven by them.
  - name: Geography and time
    slug: geography-and-time
    description: Graphs inside a MapLibre map and graphs that change over a time window.
  - name: Data integrations
    slug: data-integrations
    description: Graphs fed by TanStack DB, TanStack Query, Cypher query results and graph files.
  - name: Tools and output
    slug: tools-and-output
    description: Companions drawn beside or over the graph, and PNG and SVG exports.
skills:
  - name: core
    slug: core
    domain: graph-setup
    type: core
    description: Draw a graph from arrays of items and links, type it, style sets of elements, react to input and replace the data.
    covers:
      - defineGraph
      - nodes
      - edges
      - raw
      - mountGraph
      - GraphInstance
      - states
      - events
      - issues and count
      - keys and pending edges
      - data updates by identity
    tasks:
      - Draw a graph from an array of items and an array of links without a framework
      - Key nodes and edges that have no id field
      - Map fields to color, size and labels, and set constant colors
      - Type the data so that event targets and datum are typed
      - Fade or highlight a set of nodes by key with a state
      - React to clicks and selection changes
      - Replace the data and keep positions, view and selection
      - Find why a graph stays blank, misses edges or does not update
      - Destroy a graph when its page goes away
    failure_modes:
      - mistake: Changing the data array or items in place
        mechanism: The same mark object is not read twice and an item that is the same object counts as unchanged, so push or field assignment changes nothing on screen.
        wrong_pattern: |
          items.push(item)
          graph.update({ definition })
        correct_pattern: |
          items = [...items, item]
          graph.update({ definition: defineGraph({ marks: [nodes(items, itemOptions)] }) })
        source: docs/content/docs/(guide)/data.mdx, src/core/source-table.ts
        priority: HIGH
        status: active
      - mistake: Constant CSS color passed to the color channel
        mechanism: color goes through the color scale, so a CSS color does not compile and a function returning colors draws palette colors.
        wrong_pattern: |
          nodes(items, { color: (item) => item.hex })
        correct_pattern: |
          nodes(items, { fill: (item) => item.hex })
        source: docs/content/docs/(guide)/marks.mdx
        priority: HIGH
        status: active
      - mistake: Container without a height
        mechanism: The graph fills its container and never sizes itself, so a container 0 pixels high draws nothing.
        wrong_pattern: |
          <div id="graph"></div>
        correct_pattern: |
          #graph { height: 480px; }
        source: docs/content/docs/(guide)/installation.mdx
        priority: HIGH
        status: active
      - mistake: Selection changed through graph.states
        mechanism: Built-in states are excluded from graph.states and undeclared names do not compile.
        wrong_pattern: |
          graph.states.set('selected', { nodes: ['n1'] })
        correct_pattern: |
          graph.selection.set({ nodes: ['n1'] })
        source: src/types.ts, docs/content/docs/(guide)/states.mdx
        priority: MEDIUM
        status: active
      - mistake: Item type written on the mark call
        mechanism: Explicit type arguments stop the inference of the literal mark name, so target.mark no longer narrows datum.
        wrong_pattern: |
          nodes<Item>(items, { name: 'item' })
        correct_pattern: |
          const items: Item[] = load()
          nodes(items, { name: 'item' })
        source: docs/content/docs/(guide)/typescript.mdx
        priority: MEDIUM
        status: active
      - mistake: New option functions on every update
        mechanism: Options compare by content but functions by identity, so a new function restyles every item of its mark.
        wrong_pattern: |
          graph.update({ definition: defineGraph({ marks: [nodes(items, { label: (item) => item.name })] }) })
        correct_pattern: |
          const itemOptions = { label: (item: Item) => item.name }
          graph.update({ definition: defineGraph({ marks: [nodes(items, itemOptions)] }) })
        source: docs/content/docs/(guide)/data.mdx
        priority: MEDIUM
        status: active
      - mistake: Waiting edges taken for a bug
        mechanism: An edge whose end is missing waits for it, uncounted as a problem, so mismatched key types hide edges silently.
        wrong_pattern: |
          edges(links, { source: 'from', target: 'to' })
        correct_pattern: |
          console.log(graph.count().pending, graph.issues())
        source: docs/content/docs/(guide)/data.mdx
        priority: MEDIUM
        status: active
  - name: react
    slug: react
    domain: graph-setup
    type: framework
    description: Render the graph with the Graph component, read and drive it with hooks inside and outside Graph, and control it from React state.
    covers:
      - Graph
      - useGraph
      - useGraphState
      - useGraphEvent
      - Anchor
      - graph option of the hooks
      - controlled props
      - StrictMode
    tasks:
      - Render a graph from props or state without restyling on every render
      - Show a tooltip or overlay over the hovered node
      - Handle clicks with typed event props
      - Drive the graph from a toolbar or panel outside Graph
      - Control the selection or the view from React state
      - Mount the graph under StrictMode
    failure_modes:
      - mistake: Definition or option functions created in render
        mechanism: A new function restyles every item of its mark on each render and an unmemoized definition reads the whole data again.
        wrong_pattern: |
          <Graph definition={defineGraph({ marks: [nodes(items, { label: (item) => item.name })] })} ariaLabel="Graph" />
        correct_pattern: |
          const definition = useMemo(() => defineGraph({ marks: [nodes(items, itemOptions)] }), [items])
        source: docs/content/docs/(guide)/react.mdx
        priority: HIGH
        status: active
      - mistake: Hooks outside Graph without the graph option
        mechanism: The hooks throw without a Graph or MapGraph above them unless graph is passed, and the ref is null on the first render.
        wrong_pattern: |
          const selected: number = useGraphState((state) => state.selection.nodes.length)
        correct_pattern: |
          const selected = useGraphState((state) => state.selection.nodes.length, { graph }) ?? 0
        source: docs/content/docs/(guide)/react.mdx, src/react/index.tsx
        priority: HIGH
        status: active
      - mistake: Object selector without shallow
        mechanism: useGraphState compares with Object.is, so a selector that builds an object renders on every state change.
        wrong_pattern: |
          useGraphState((state) => ({ count: state.selection.nodes.length }))
        correct_pattern: |
          useGraphState((state) => ({ count: state.selection.nodes.length }), { compare: shallow })
        source: docs/content/docs/(guide)/react.mdx
        priority: HIGH
        status: active
      - mistake: Untyped selectors inside Graph
        mechanism: Components inside Graph cannot see the definition, so datum is unknown without a typed selector parameter.
        wrong_pattern: |
          useGraphState((state) => state.hovered)
        correct_pattern: |
          useGraphState((state: GraphState<string, Marks>) => state.hovered)
        source: docs/content/docs/(guide)/typescript.mdx
        priority: MEDIUM
        status: active
      - mistake: Graph structure read during render
        mechanism: Structure reads apply pending data changes and update the store, which renders other components while React renders.
        wrong_pattern: |
          const near = graph.neighbors(key)
        correct_pattern: |
          useGraphEvent('click', ({ target }) => setNear(target ? graph.neighbors(target.key) : []))
        source: src/host/mount-graph.ts
        priority: MEDIUM
        status: active
      - mistake: Controlled prop set after mount
        mechanism: Controlled mode is decided at mount, so a prop that starts undefined never takes control.
        wrong_pattern: |
          <Graph selection={ready ? selection : undefined} />
        correct_pattern: |
          const [selection, setSelection] = useState<ElementKeysInput>({ nodes: [] })
        source: docs/content/docs/(guide)/react.mdx
        priority: MEDIUM
        status: active
