      - mistake: "Ignoring issues"
        mechanism: "A reader never throws for bad data, so a half-read file looks fine while issues lists the skipped and pending parts."
        source: "src/formats/types.ts"
        priority: MEDIUM
        status: active
      - mistake: "Trusting detectFormat on arbitrary text"
        mechanism: "Any text that is not JSON or XML is called csv."
        source: "src/formats/detect.ts"
        priority: MEDIUM
        status: active
      - mistake: "Mixing numeric and string ids"
        mechanism: 'File ids are strings, so edges naming 1 wait for the node with id "1".'
        source: "src/formats/types.ts"
        priority: MEDIUM
        status: active
      - mistake: "Expecting writeCsv to return a string"
        mechanism: "writeCsv returns { nodes, edges }, two texts, and writers throw TypeError for a node without key."
        source: "docs/content/docs/api/formats.mdx"
        priority: MEDIUM
        status: active
  - name: paths
    slug: paths
    domain: structure
    type: sub-skill
    description: "Find shortest paths and reachable nodes, and highlight them."
    covers:
      - "graph.paths"
      - "createPathFinder"
      - "shortest"
      - "reach"
      - "weights"
      - "direction"
      - "visible"
      - "highlighting"
    tasks:
      - "Find and highlight the shortest path between two nodes"
      - "Find every node within reach of a node"
      - "Keep a search to some nodes and edges"
      - "Search the graph as drawn"
      - "Search paths without mounting a graph"
    failure_modes:
      - mistake: "Weights that are missing or negative"
        mechanism: "An edge whose weight is missing, not a number or infinite cannot be crossed, so the path detours or is null, and a negative weight throws a RangeError."
        wrong_pattern: |
          graph.paths.shortest('a', 'b', { weight: 'minutes' })
        correct_pattern: |
          graph.paths.shortest('a', 'b', { weight: (link) => Math.max(0, Number(link.minutes) || 0) })
        source: "src/types.ts, docs/content/docs/(guide)/paths.mdx"
        priority: HIGH
        status: active
      - mistake: "Reading null or an empty result as a bug"
        mechanism: "shortest returns null for no path, an unknown key or an end that fails the nodes predicate, and reach returns an empty result."
        source: "docs/content/docs/(guide)/paths.mdx"
        priority: HIGH
        status: active
      - mistake: "Expecting a directed search by default"
        mechanism: "Edges are crossed both ways unless direction is forward or backward, whatever arrows are drawn."
        wrong_pattern: |
          graph.paths.shortest('a', 'b')
        correct_pattern: |
          graph.paths.shortest('a', 'b', { direction: 'forward' })
        source: "src/types.ts"
        priority: HIGH
        status: active
      - mistake: "A weight field that does not exist"
        mechanism: "weight is checked against the edge items when marks are typed by inference."
        source: "src/types.ts"
        priority: MEDIUM
        status: active
      - mistake: "A negative or NaN maxCost"
        mechanism: "reach throws a RangeError for a maxCost below 0 or NaN."
        source: "src/core/path-query.ts"
        priority: MEDIUM
        status: active
      - mistake: "Searching the data and expecting what is drawn"
        mechanism: "Without visible a path can cross folded groups and filtered nodes, and its keys put states on elements that are not on screen."
        source: "docs/content/docs/(guide)/paths.mdx"
        priority: MEDIUM
        status: active
      - mistake: "Forgetting destroy on a path finder"
        mechanism: "A finder subscribes to live sources when created."
        source: "src/paths.ts"
        priority: MEDIUM
        status: active
  - name: styling
    slug: styling
    domain: appearance
    type: sub-skill
    description: Style nodes and labels with scales, images, badges, shapes and themes.
    covers:
      - scales
      - labels
      - images
      - badges
      - box shape
      - outlines
      - theme tokens
    tasks:
      - Map data values to colors, sizes and widths with scales
      - Style node labels
      - Put images, tinted icons and badges in nodes
      - Draw box nodes that fit their label
      - Theme the graph for light and dark with CSS variables
      - Override a theme token for one graph or one theme
      - Give a node mark scales of its own
    failure_modes:
      - mistake: Expecting a gradient from a numeric color
        mechanism: The color scale is categorical by default, even for numbers, so a numeric color channel draws one palette color per distinct value with no order.
        wrong_pattern: |
          nodes(items, { color: 'score' })
        correct_pattern: |
          defineGraph({
            marks: [nodes(items, { color: 'score' })],
            scales: { color: { type: 'sequential', domain: [0, 100] } },
          })
        source: docs/content/docs/(guide)/scales.mdx
        priority: HIGH
        status: active
      - mistake: A computed pixel size that goes through the scale
        mechanism: A function given to size is a channel, so its result is squeezed into the size range [8, 32] by the square root scale and never draws the pixel diameters it returns.
        wrong_pattern: |
          nodes(items, { size: (item) => item.radius * 2 })
        correct_pattern: |
          nodes(items, { size: raw((item) => item.radius * 2) })
        source: docs/content/docs/(guide)/marks.mdx, src/core/raw.ts
        priority: HIGH
        status: active
      - mistake: A field name in a style
        mechanism: "Styles take a constant or a function, never a field name: a numeric style given a field name does not compile, and a color style given one compiles and is read as a CSS color."
        wrong_pattern: |
          nodes(items, { label: { text: 'name', size: 'weight' } })
        correct_pattern: |
          nodes(items, { label: { text: 'name', size: (item) => item.weight } })
        source: docs/content/docs/(guide)/marks.mdx, src/types.ts
        priority: HIGH
        status: active
      - mistake: A constant color in the color channel
        mechanism: color goes through the color scale, so a CSS color does not compile and a function returning colors draws palette colors.
        wrong_pattern: |
          nodes(items, { color: (item) => item.hex })
        correct_pattern: |
          nodes(items, { color: raw((item) => item.hex) })
        source: docs/content/docs/(guide)/marks.mdx
        priority: HIGH
        status: active
      - mistake: A label that is not a string
        mechanism: Only a non-empty string draws a label, and a function that returns a number does not compile.
        wrong_pattern: |
          nodes(items, { label: (item) => item.count })
        correct_pattern: |
          nodes(items, { label: (item) => String(item.count) })
        source: docs/content/docs/(guide)/labels.mdx
        priority: MEDIUM
        status: active
      - mistake: The theme stylesheet is missing
        mechanism: Every color falls back to its light value without theme.css, so a dark page or a dark class changes nothing.
        wrong_pattern: |
          import '@bruno00o/graph'
        correct_pattern: |
          import '@bruno00o/graph/theme.css'
        source: docs/content/docs/(guide)/theming.mdx
        priority: MEDIUM
        status: active
      - mistake: One image per node
        mechanism: At most 256 distinct images are drawn at once, so the 257th node of a graph with one image each stays plain.
        wrong_pattern: |
          nodes(items, { image: (item) => `/labels/${item.id}.svg` })
        correct_pattern: |
          nodes(items, { image: (item) => `/icons/${item.kind}.svg`, label: 'name' })
        source: docs/content/docs/(guide)/images-and-badges.mdx
        priority: MEDIUM
        status: active
      - mistake: Hard-coded colors that ignore the theme
        mechanism: A hex value is identical in light and dark, so text or fills stay unreadable in one of the themes.
        wrong_pattern: |
          nodes(items, { label: { text: 'name', color: '#222222' } })
        correct_pattern: |
          nodes(items, { label: { text: 'name', color: 'var(--graph-ink)' } })
        source: docs/content/docs/(guide)/theming.mdx
        priority: MEDIUM
        status: active
  - name: tools
    slug: tools
    domain: tools-and-output
    type: sub-skill
    description: Add a minimap, a legend, a lens, anchored HTML, hulls, a background grid or the devtools panel.
    covers:
      - createMinimap
      - Minimap
      - createLegend
      - Legend
      - lens
      - anchors
      - hull
      - background
      - devtools
    tasks:
      - Add a minimap
      - Add a legend that highlights and filters
      - Magnify a dense region with a lens
      - Pin HTML to nodes and edges
      - Draw hulls around sets of nodes and a background grid
      - Inspect graphs in the TanStack Devtools panel
    failure_modes:
      - mistake: A minimap or a lens on a map
        mechanism: "The map owns the camera: the minimap does not support a map graph and graph.lens.set does nothing there."
        wrong_pattern: |
          mountMapGraph(map, { definition, ariaLabel })
          createMinimap(graph)
        correct_pattern: |
          mountMapGraph(map, { definition, ariaLabel })
        source: docs/content/docs/(guide)/map.mdx, src/host/lens.ts
        priority: HIGH
        status: active
      - mistake: A legend state that the definition does not declare
        mechanism: "highlight and hidden name free states: an undeclared name does not compile on a typed graph and throws at run time otherwise."
        wrong_pattern: |
          createLegend(graph, { highlight: 'match' })
        correct_pattern: |
          defineGraph({ marks, states: { match: { outline: 'var(--graph-accent)' } } })
          createLegend(graph, { highlight: 'match' })
        source: docs/content/docs/api/legend.mdx
        priority: HIGH
        status: active
      - mistake: A hidden legend state that does not hide
        mechanism: "A hidden state with only an opacity fades the elements of an off item instead of filtering the graph, which needs hide: true."
        wrong_pattern: |
          states: { faded: { opacity: 0.1 } }
        correct_pattern: |
          states: { faded: { opacity: 0.1, hide: true } }
        source: docs/content/docs/(guide)/minimap-and-legend.mdx
        priority: HIGH
        status: active
      - mistake: A hull made from another mark object
        mechanism: A hull matches the nodes of the mark object passed to marks, so a second nodes() call or a mark rebuilt in render encloses nothing.
        wrong_pattern: |
          marks: [nodes(items)],
          hulls: [hull({ nodes: nodes(items), by: 'group' })]
        correct_pattern: |
          const people = nodes(items)
          marks: [people],
          hulls: [hull({ nodes: people, by: 'group' })]
        source: docs/content/docs/api/hull.mdx, src/core/hull-layer.ts
        priority: HIGH
        status: active
      - mistake: when on a point or a state anchor
        mechanism: when needs a node or an edge that can be in a state, so a point or a state target takes none and the types refuse it.
        wrong_pattern: |
          graph.anchors.set(element, { point, when: 'hovered' })
        correct_pattern: |
          graph.anchors.set(element, { node: key, when: 'hovered' })
        source: docs/content/docs/api/graph-instance.mdx, src/host/anchors.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting anchored HTML in an export
        mechanism: Anchors are HTML over the canvas, not part of the scene, so no export draws them.
        wrong_pattern: |
          graph.anchors.set(tooltip, { node: key })
          await exportPng(graph)
        correct_pattern: |
          await exportPng(graph)
        source: docs/content/docs/(guide)/export.mdx
        priority: MEDIUM
        status: active
      - mistake: The lens that never shows
        mechanism: interaction.lens is off by default, and the key is ignored while a text field has the focus.
        wrong_pattern: |
          defineGraph({ marks })
        correct_pattern: |
          defineGraph({ marks, interaction: { lens: true } })
        source: docs/content/docs/(guide)/lens.mdx
        priority: MEDIUM
        status: active
      - mistake: Panel messages created in render
        mechanism: A new messages object passed to GraphDevtoolsPanel mounts the panel again at every render.
        wrong_pattern: |
          <GraphDevtoolsPanel messages={{ title: 'Graph' }} />
        correct_pattern: |
          const messages = { title: 'Graph' }
          <GraphDevtoolsPanel messages={messages} />
        source: docs/content/docs/api/devtools.mdx
        priority: MEDIUM
        status: active
  - name: export
    slug: export
    domain: tools-and-output
    type: sub-skill
    description: Save the graph as a PNG image or an SVG document.
    covers:
      - exportPng
      - exportSvg
      - region
      - pixel ratio
      - labels
      - background
    tasks:
      - Save the graph as a PNG image
      - Save the graph as an SVG document
      - Export a region at a scale, with a background
    failure_modes:
      - mistake: Exporting a destroyed graph
        mechanism: An export of a destroyed graph, or of one not made by mountGraph, rejects instead of producing a file.
        wrong_pattern: |
          graph.destroy()
          await exportPng(graph)
        correct_pattern: |
          const png = await exportPng(graph)
          graph.destroy()
        source: docs/content/docs/api/export.mdx, src/host/lifecycle.ts
        priority: HIGH
        status: active
      - mistake: Not awaiting the export
        mechanism: Both functions return promises, and an SVG is a string that needs a Blob of type image/svg+xml to be downloaded.
        wrong_pattern: |
          download(exportPng(graph), 'graph.png')
        correct_pattern: |
          download(await exportPng(graph), 'graph.png')
        source: docs/content/docs/(guide)/export.mdx
        priority: HIGH
        status: active
      - mistake: Expecting a transparent PNG by default
        mechanism: The default background is the paper color of the current theme.
        wrong_pattern: |
          await exportPng(graph)
        correct_pattern: |
          await exportPng(graph, { background: 'transparent' })
        source: docs/content/docs/(guide)/export.mdx
        priority: MEDIUM
        status: active
      - mistake: Mixing up zoom and pixel ratio
        mechanism: zoom rescales the content while pixelRatio only adds pixels, and neither accepts a non-positive or infinite value.
        wrong_pattern: |
          await exportPng(graph, { zoom: 4 })
        correct_pattern: |
          await exportPng(graph, { pixelRatio: 4 })
        source: docs/content/docs/(guide)/export.mdx, src/export/index.ts
        priority: MEDIUM
        status: active
      - mistake: Labels missing in a zoomed-out file
        mechanism: labels visible applies the screen rules, so small and overlapping labels are hidden at a small zoom.
        wrong_pattern: |
          await exportSvg(graph, { region: 'graph' })
        correct_pattern: |
          await exportSvg(graph, { region: 'graph', labels: 'all' })
        source: docs/content/docs/(guide)/export.mdx
        priority: MEDIUM
        status: active
      - mistake: Exporting a graph with no size
        mechanism: A hidden graph or one that measures less than one pixel has nothing to draw, so the export rejects with a RangeError.
        wrong_pattern: |
          container.hidden = true
          await exportPng(graph)
        correct_pattern: |
          await exportPng(graph, { region: 'graph' })
        source: src/export/index.ts
        priority: MEDIUM
        status: active
  - name: shapes
    slug: shapes
    domain: structure
    type: sub-skill
    description: Draw zones, rings, rectangles and lines from your own geometry under the graph, and make them selectable, styled and shown by zoom, time and layer.
    covers:
      - shapes
      - geometry forms and units
      - fill, stroke, strokeWidth, dash, opacity, order
      - pick
      - shape targets, selection and lasso
      - states by kind and others across kinds
      - minZoom, maxZoom, time and layer on shapes
      - view.fit shapes
      - count shapes and invalid-shape issues
      - shapes in PNG and SVG exports
    tasks:
      - Draw zones, rings, rectangles, lines and polygons with holes under a graph
      - Place GeoJSON polygons and lines next to nodes
      - Let people click and select a zone while a decorative zone ignores the pointer
      - Dim everything outside a selected zone, or dim only the nodes
      - Hide a zone below a zoom, outside a time window or with a layer
      - Frame a zone and count the shapes drawn
      - Find the shapes whose geometry cannot be drawn
    failure_modes:
      - mistake: Importing shapes from the main entry
        mechanism: shapes lives in its own entry point, so the main entry has the types and no function.
        wrong_pattern: |
          import { shapes } from '@bruno00o/graph'
        correct_pattern: |
          import { shapes } from '@bruno00o/graph/shapes'
        source: docs/content/docs/api/shapes.mdx, src/shapes/index.ts
        priority: HIGH
        status: active
      - mistake: A decorative zone that swallows the pointer
        mechanism: A filled or stroked shape takes clicks, hover and the lasso by default, so a backdrop selects itself instead of clearing the selection. pick belongs to a mark, so decoration and zones are two marks.
        wrong_pattern: |
          shapes([sea])
        correct_pattern: |
          shapes([sea], { pick: false })
        source: docs/content/docs/(guide)/shapes.mdx, src/shapes/pick.ts
        priority: HIGH
        status: active
      - mistake: Expecting labels on shapes
        mechanism: Shapes have no label option yet, so the option does not compile.
        wrong_pattern: |
          shapes(zones, { label: 'title' })
        correct_pattern: |
          Show the title from pointerenter and target.datum in an HTML tooltip
        source: docs/content/docs/(guide)/shapes.mdx
        priority: HIGH
        status: active
      - mistake: Mixing degrees and world units
        mechanism: GeoJSON and longitude and latitude points are projected to a world 512 units wide, so a zone in degrees does not land around nodes placed with x and y.
        wrong_pattern: |
          nodes(places, { x: 'x', y: 'y' }) with shapes of GeoJSON polygons
        correct_pattern: |
          nodes(places, { longitude: 'lng', latitude: 'lat' }) with the same GeoJSON polygons
        source: docs/content/docs/(guide)/shapes.mdx, src/core/geo.ts
        priority: HIGH
        status: active
      - mistake: Reading shape counts or keys on a graph without a shape mark
        mechanism: count().shapes and selection.get().shapes exist only when the definition has a shape mark, and shape keys are ignored otherwise.
        wrong_pattern: |
          graph.count().shapes
        correct_pattern: |
          Add a shapes() mark to the definition, or read nodes and edges only
        source: src/host/graph-instance.ts, src/host/events.ts
        priority: MEDIUM
        status: active
      - mistake: Treating every target that is not a node as an edge
        mechanism: With a shape mark, or on an untyped instance, a target may be a shape, so an else after the node case holds shapes and an exhaustive switch needs case shape.
        wrong_pattern: |
          if (target.kind === 'node') return
          console.log(target.endpoints)
        correct_pattern: |
          if (target.kind === 'edge') console.log(target.endpoints)
        source: src/host/events.ts, docs/content/docs/(guide)/typescript.mdx
        priority: MEDIUM
        status: active
      - mistake: Coordinates typed as number[][]
        mechanism: A point is an object or an [x, y] tuple, so data typed number[][][] does not satisfy the geometry channel when the field is named.
        wrong_pattern: |
          type Zone = { id: string; outline: { rings: number[][][] } }
        correct_pattern: |
          type Zone = { id: string; outline: ShapeGeometry }
        source: src/types.ts
        priority: MEDIUM
        status: active
      - mistake: A state for nodes that also dims the zones
        mechanism: A member of any kind activates others for every kind, so a style for both kinds fades nodes, edges and shapes outside the state.
        wrong_pattern: |
          states: { focus: { others: { opacity: 0.2 } } }
        correct_pattern: |
          states: { focus: { nodes: { others: { opacity: 0.2 } } } }
        source: docs/content/docs/(guide)/shapes.mdx, docs/content/docs/(guide)/states.mdx
        priority: MEDIUM
        status: active
      - mistake: Changing a shape in place
        mechanism: The graph reads an item once and a geometry once per object, so pushing into a ring or assigning a field changes nothing on screen.
        wrong_pattern: |
          zones[0].geometry.rings[0].push([450, 0])
        correct_pattern: |
          zones = [{ ...zones[0], geometry: { rings: [[...ring, [450, 0]]] } }, ...zones.slice(1)]
        source: src/core/shape-store.ts
        priority: MEDIUM
        status: active
      - mistake: Using a field name as a color
        mechanism: fill and stroke are styles, so a string is the CSS color itself and never a field of the item.
        wrong_pattern: |
          shapes(zones, { fill: 'tone' })
        correct_pattern: |
          shapes(zones, { fill: (zone) => zone.tone })
        source: src/types.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting shapes on a map
        mechanism: A graph drawn on a map does not draw or pick shapes yet and warns once in development, while count().shapes still counts them.
        wrong_pattern: |
          mountMapGraph(map, { definition: defineGraph({ marks: [shapes(zones)] }), ariaLabel: 'Map' })
        correct_pattern: |
          Draw regions with the layers of the map until shapes support it
        source: src/map/index.ts, docs/content/docs/(guide)/shapes.mdx
        priority: MEDIUM
        status: active
tensions:
  - name: Rebuilt definitions against stable identities
    skills:
      - core
      - react
    description: React rebuilds values on every render, while the graph compares mark objects, items and option functions by identity.
    implication: An agent that rebuilds the definition in render with inline functions restyles every item on every render.
cross_references:
  - from: react
    to: core
    reason: Data, marks, states and the instance API are the same in React; the react skill only covers what React changes.
  - from: core
    to: react
    reason: React apps render the graph with Graph instead of mountGraph.
gaps:
  - skill: core
    question: Migration between versions (the upgrading page) has no skill yet.
    context: Agents updating the package across breaking versions would need it; left out of the first plan.
    status: open
  - skill: core
    question: Browser support, WebGL2 limits and software rendering have no skill yet.
    context: The browser-support guide covers them; a skill is needed only if agents get them wrong.
    status: open
