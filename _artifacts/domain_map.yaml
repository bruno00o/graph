  - name: styling
    slug: styling
    domain: appearance
    type: sub-skill
    description: Style nodes and labels with scales, images, badges, shapes and themes.
    covers:
      - scales
      - labels
      - images
      - badges
      - box shape
      - outlines
      - theme tokens
    tasks:
      - Map data values to colors, sizes and widths with scales
      - Style node labels
      - Put images, tinted icons and badges in nodes
      - Draw box nodes that fit their label
      - Theme the graph for light and dark with CSS variables
      - Override a theme token for one graph or one theme
      - Give a node mark scales of its own
    failure_modes:
      - mistake: Expecting a gradient from a numeric color
        mechanism: The color scale is categorical by default, even for numbers, so a numeric color channel draws one palette color per distinct value with no order.
        wrong_pattern: |
          nodes(items, { color: 'score' })
        correct_pattern: |
          defineGraph({
            marks: [nodes(items, { color: 'score' })],
            scales: { color: { type: 'sequential', domain: [0, 100] } },
          })
        source: docs/content/docs/(guide)/scales.mdx
        priority: HIGH
        status: active
      - mistake: A computed pixel size that goes through the scale
        mechanism: A function given to size is a channel, so its result is squeezed into the size range [8, 32] by the square root scale and never draws the pixel diameters it returns.
        wrong_pattern: |
          nodes(items, { size: (item) => item.radius * 2 })
        correct_pattern: |
          nodes(items, { size: raw((item) => item.radius * 2) })
        source: docs/content/docs/(guide)/marks.mdx, src/core/raw.ts
        priority: HIGH
        status: active
      - mistake: A field name in a style
        mechanism: "Styles take a constant or a function, never a field name: a numeric style given a field name does not compile, and a color style given one compiles and is read as a CSS color."
        wrong_pattern: |
          nodes(items, { label: { text: 'name', size: 'weight' } })
        correct_pattern: |
          nodes(items, { label: { text: 'name', size: (item) => item.weight } })
        source: docs/content/docs/(guide)/marks.mdx, src/types.ts
        priority: HIGH
        status: active
      - mistake: A constant color in the color channel
        mechanism: color goes through the color scale, so a CSS color does not compile and a function returning colors draws palette colors.
        wrong_pattern: |
          nodes(items, { color: (item) => item.hex })
        correct_pattern: |
          nodes(items, { color: raw((item) => item.hex) })
        source: docs/content/docs/(guide)/marks.mdx
        priority: HIGH
        status: active
      - mistake: A label that is not a string
        mechanism: Only a non-empty string draws a label, and a function that returns a number does not compile.
        wrong_pattern: |
          nodes(items, { label: (item) => item.count })
        correct_pattern: |
          nodes(items, { label: (item) => String(item.count) })
        source: docs/content/docs/(guide)/labels.mdx
        priority: MEDIUM
        status: active
      - mistake: The theme stylesheet is missing
        mechanism: Every color falls back to its light value without theme.css, so a dark page or a dark class changes nothing.
        wrong_pattern: |
          import '@bruno00o/graph'
        correct_pattern: |
          import '@bruno00o/graph/theme.css'
        source: docs/content/docs/(guide)/theming.mdx
        priority: MEDIUM
        status: active
      - mistake: One image per node
        mechanism: At most 256 distinct images are drawn at once, so the 257th node of a graph with one image each stays plain.
        wrong_pattern: |
          nodes(items, { image: (item) => `/labels/${item.id}.svg` })
        correct_pattern: |
          nodes(items, { image: (item) => `/icons/${item.kind}.svg`, label: 'name' })
        source: docs/content/docs/(guide)/images-and-badges.mdx
        priority: MEDIUM
        status: active
      - mistake: Hard-coded colors that ignore the theme
        mechanism: A hex value is identical in light and dark, so text or fills stay unreadable in one of the themes.
        wrong_pattern: |
          nodes(items, { label: { text: 'name', color: '#222222' } })
        correct_pattern: |
          nodes(items, { label: { text: 'name', color: 'var(--graph-ink)' } })
        source: docs/content/docs/(guide)/theming.mdx
        priority: MEDIUM
        status: active
  - name: tools
    slug: tools
    domain: tools-and-output
    type: sub-skill
    description: Add a minimap, a legend, a lens, anchored HTML, hulls, a background grid or the devtools panel.
    covers:
      - createMinimap
      - Minimap
      - createLegend
      - Legend
      - lens
