        mechanism: exportMapPng writes the attribution of the map and an empty attribution removes it, which most tile licenses forbid.
        wrong_pattern: |
          exportMapPng(graph, { attribution: '' })
        correct_pattern: |
          exportMapPng(graph, { pixelRatio: 2 })
        source: src/map/export.ts
        priority: MEDIUM
        status: active
      - mistake: A map container with no height
        mechanism: MapLibre sizes the map from its container, so a container with no height draws nothing, the graph included.
        wrong_pattern: |
          <div id="map"></div>
        correct_pattern: |
          #map { height: 480px; }
        source: docs/content/docs/(guide)/map.mdx
        priority: MEDIUM
        status: active
      - mistake: Sizing the map container with Tailwind CSS v4 utilities
        mechanism: "The MapLibre stylesheet sets position: relative on the container through the class maplibregl-map, outside any cascade layer, so it beats Tailwind CSS v4 utilities in @layer utilities; a container with absolute inset-0 stays relative, 0 px high, and nothing warns on a map."
        wrong_pattern: |
          <div ref={setContainer} className="absolute inset-0" />
        correct_pattern: |
          <div ref={setContainer} style={{ position: 'absolute', inset: 0 }} />
        source: docs/content/docs/(guide)/map.mdx
        priority: MEDIUM
        status: active
      - mistake: Giving a snapshot to the other surface
        mechanism: A graph moved with surface keeps the positions of each side by itself; when it is destroyed and mounted again, a snapshot from a plain graph holds the units of its layout and one from a map the world units of the map, so passed as initialPositions to the other surface it places nodes without coordinates in the wrong place.
        wrong_pattern: |
          mountMapGraph(map, { definition, ariaLabel, initialPositions: plainGraph.positions.snapshot() })
        correct_pattern: |
          mountMapGraph(map, { definition, ariaLabel, initialPositions: saved.map })
        source: docs/content/docs/(guide)/map.mdx, docs/content/docs/(guide)/positions.mdx
        priority: MEDIUM
        status: active
      - mistake: Hiding the map element with display none
        mechanism: "A graph that moves back to its canvas leaves the map element in the page, and display none gives the map a size of 0, so the graph that comes back to it draws nothing."
        wrong_pattern: |
          mapElement.style.display = 'none'
        correct_pattern: |
          mapElement.style.opacity = '0'
          mapElement.style.pointerEvents = 'none'
        source: docs/content/docs/(guide)/map.mdx
        priority: MEDIUM
        status: active
      - mistake: Moving a graph with the definition of the other side
        mechanism: "update surface without the matching definition keeps the old one: longitude and latitude on the canvas pin every node at its place in the 512-unit world and no layout moves them, and a definition without coordinates on the map leaves nodes near their neighbors."
        wrong_pattern: |
          graph.update({ surface: null })
        correct_pattern: |
          graph.update({ surface: null, definition: plain })
        source: docs/content/docs/(guide)/map.mdx, src/core/positions.ts
        priority: MEDIUM
        status: active
      - mistake: A second graph on one surface
        mechanism: "A surface holds one graph at a time, so moving another graph onto it, or onto a surface whose map was removed, throws an Error."
        wrong_pattern: |
          other.update({ surface })
        correct_pattern: |
          other.update({ surface: mapSurface(map, { id: 'other' }) })
        source: src/map/index.ts, docs/content/docs/api/map.mdx
        priority: MEDIUM
        status: active
      - mistake: Expecting spread to move nodes that only overlap
        mechanism: spread moves apart nodes at the very same coordinates only, so places a few meters apart overlap at low zooms and stay put.
        wrong_pattern: |
          defineGraph({ marks: [nodes(places, { longitude: 'lng', latitude: 'lat' })], spread: true }) for nearby places
        correct_pattern: |
          groups(places, { by: (place) => place.city }) whose children spread when it unfolds, or the geo layout on the canvas
        source: docs/content/docs/(guide)/positions.mdx, src/core/spread.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting a node without coordinates to follow the zoom
        mechanism: A node without coordinates starts on a ring sized in pixels at the zoom of its arrival, then keeps that place in world units, so it drifts away when zooming in and covers its neighbor when zooming out.
        wrong_pattern: |
          nodes(places, { longitude: (place) => place.lng, latitude: (place) => place.lat }) with places lacking lng and lat
        correct_pattern: |
          Approximate coordinates for every node, or a group with its neighbor
        source: docs/content/docs/(guide)/map.mdx, src/host/placement.ts
        priority: MEDIUM
        status: active
  - name: time
    slug: time
    domain: geography-and-time
    type: sub-skill
    description: Give elements a time, show a time window, and add a timeline.
    covers:
      - time channel
      - graph.time
      - time fade
      - createTimeline
      - mountTimeline
      - Timeline
      - useTimeline
      - time window boundaries
      - timeline store and actions
      - events of the application on the timeline
      - instant (a moment as cursor) and stepEvent
      - a timeline without a graph
      - historyFrom and the history option (values that change over time)
      - graph.history.of and graph.history.instant
      - scales over the whole journal
      - several periods in the time channel
      - presence entries in a journal (present)
    tasks:
      - Give nodes and edges a time or a period
      - Show only what exists in a time window
      - Fade elements at the edges of the window
      - Add a timeline that brushes, steps and plays
      - Control the time window from state
      - Draw a timeline of your own from its store
      - Count the events of the application on the bar and step through them
      - Show the values of each moment from a journal of changes
      - Show elements that come and go over several periods
      - Turn a journal of openings and closings into periods of presence
    failure_modes:
      - mistake: Giving times as strings
        mechanism: A string is not a time, so the element has no time and always shows, with nothing reported.
        wrong_pattern: |
          nodes(items, { time: 'created' })
        correct_pattern: |
          nodes(items, { time: (item) => Date.parse(item.created) })
        source: src/core/time-range.ts, src/types.ts
        priority: HIGH
        status: active
      - mistake: Expecting the end of a period to be inside the window
        mechanism: Ends are exclusive on both the period and the window, so a period that ends where the window starts does not show.
        wrong_pattern: |
          graph.time.set({ start: t, end: t + 1 })
        correct_pattern: |
          graph.time.set({ start: t, end: t })
        source: docs/content/docs/(guide)/time.mdx, src/core/time-range.ts
        priority: HIGH
        status: active
      - mistake: Controlling the window without both props
        mechanism: Controlled mode is decided at mount by time and never changes, so update time on an uncontrolled graph does nothing and a controlled graph ignores time.set until answered.
        wrong_pattern: |
          mountGraph(container, { definition, ariaLabel: 'Graph' })
          graph.update({ time: window })
        correct_pattern: |
          mountGraph(container, { definition, ariaLabel: 'Graph', time: null, onTimeChange })
        source: src/host/mount-graph.ts, docs/content/docs/(guide)/time.mdx
        priority: HIGH
        status: active
      - mistake: A timeline over data with no times
        mechanism: Without elements that have a time, and without events, the timeline has no extent and play does nothing.
        wrong_pattern: |
          createTimeline(graph)
        correct_pattern: |
          createTimeline(graph, { extent: { start, end } })
        source: src/timeline/index.ts
        priority: MEDIUM
        status: active
      - mistake: Mixing local and UTC times
        mechanism: Bins and ticks follow the local time zone, so times and window edges written in UTC look one hour or one day off.
        wrong_pattern: |
          graph.time.set({ start: Date.UTC(2024, 0, 1) })
        correct_pattern: |
          graph.time.set({ start: new Date(2024, 0, 1) })
        source: docs/content/docs/api/timeline.mdx
        priority: MEDIUM
        status: active
      - mistake: Fade in the wrong unit
        mechanism: time fade is in the milliseconds of the data, so a duration written in days fades nothing or everything.
        wrong_pattern: |
          defineGraph({ marks, time: { fade: 30 } })
        correct_pattern: |
          defineGraph({ marks, time: { fade: 30 * 86_400_000 } })
        source: src/types.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting the layout to follow the window
        mechanism: Layouts place every node whatever the window and hidden nodes keep their place, so the graph does not rearrange.
        wrong_pattern: |
          graph.time.set(window)
        correct_pattern: |
          Build the data for the window to lay out only what exists then
        source: docs/content/docs/(guide)/time.mdx
        priority: MEDIUM
        status: active
      - mistake: A timeline outside Graph without a graph
        mechanism: The Timeline component and useTimeline read the graph from context, so outside Graph or MapGraph they throw without the graph option.
        wrong_pattern: |
          <Timeline />
        correct_pattern: |
          <Timeline graph={graph} />
        source: src/react/index.tsx, docs/content/docs/api/timeline.mdx
        priority: MEDIUM
        status: active
      - mistake: Rebuilding events or its readers in render
        mechanism: "A new array of new objects, or a new eventTime or eventKind function, counts every event again on each render; an array that starts with the same objects only reads the additions."
        wrong_pattern: |
          useTimeline({ graph: false, events: log.map(toEvent), eventTime: (event) => event.at })
        correct_pattern: |
          const events = useMemo(() => log.map(toEvent), [log])
          useTimeline({ graph: false, events, eventTime: 'at' })
        source: docs/content/docs/api/timeline.mdx, src/timeline/events.ts
        priority: MEDIUM
        status: active
      - mistake: graph null where graph false was meant
        mechanism: "graph null waits for a graph, so the state stays empty and the timeline stays null; graph false makes a timeline without a graph that counts its events."
        wrong_pattern: |
          useTimeline({ graph: null, events })
        correct_pattern: |
          useTimeline({ graph: false, events })
        source: src/react/index.tsx, docs/content/docs/api/timeline.mdx
        priority: MEDIUM
        status: active
      - mistake: Building the history in render
        mechanism: "A historyFrom call made at each render or update is a new history, so the journal is indexed again and every element reads again; the same object across definitions keeps its index."
        wrong_pattern: |
          defineGraph({ marks: [nodes(items, { history: historyFrom(changes) })] })
        correct_pattern: |
          const history = historyFrom(changes)
          defineGraph({ marks: [nodes(items, { history })] })
        source: docs/content/docs/api/history.mdx, src/history/index.ts
        priority: HIGH
        status: active
      - mistake: history on groups
        mechanism: "A group has no history, so groups() refuses the option; give the history to the nodes mark, and aggregates and containers read the values of the moment."
        wrong_pattern: |
          groups(items, { by: 'state', history })
        correct_pattern: |
          nodes(items, { history })
        source: docs/content/docs/api/history.mdx, src/types.ts
        priority: MEDIUM
        status: active
      - mistake: A history that historyFrom did not make
        mechanism: "The type is open, so an object typed by hand compiles, and defineGraph throws a TypeError for a history that historyFrom did not return."
        wrong_pattern: |
          const history: HistorySource<HistoryValues<Item>> = {}
          nodes(items, { history })
        correct_pattern: |
          const history = historyFrom(changes)
          nodes(items, { history })
        source: src/define-graph.ts, src/core/history.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting the scales to follow the moment
        mechanism: "The scales of a mark with a history cover every value of the whole journal, so the cursor never rescales and a size or sequential color spans values not shown now; there is no instant-only option, a domain fixes the bounds."
        wrong_pattern: |
          nodes(items, { size: 'level', history })
        correct_pattern: |
          defineGraph({ marks, scales: { size: { domain: [0, 10] } } })
        source: docs/content/docs/(guide)/time.mdx, src/history/scales.ts
        priority: MEDIUM
        status: active
      - mistake: A wide jump over a large journal
        mechanism: "A step reads again only the elements whose entries it crosses, so a jump over weeks reads every element it crosses and costs one slow frame."
        wrong_pattern: |
          graph.time.set(null)
        correct_pattern: |
          timeline.stepEvent()
        source: docs/content/docs/(guide)/time.mdx, src/history/track.ts
        priority: MEDIUM
        status: active
      - mistake: An empty list where no time was meant
        mechanism: An empty list in the time channel means the element never exists, so an item without periods is hidden in every window, with nothing reported.
        wrong_pattern: |
          time: (item) => item.stays.map(toPeriod)
        correct_pattern: |
          time: (item) => (item.stays.length > 0 ? item.stays.map(toPeriod) : null)
        source: src/core/time-range.ts, docs/content/docs/(guide)/time.mdx
        priority: HIGH
        status: active
      - mistake: One period from the first start to the last end
        mechanism: A single envelope period shows an element that comes and goes in every gap between its stays, and the histogram counts it there.
        wrong_pattern: |
          time: (item) => ({ start: item.stays[0].from, end: item.stays.at(-1).to })
        correct_pattern: |
          time: (item) => item.stays.map((stay) => ({ start: stay.from, end: stay.to }))
        source: docs/content/docs/(guide)/time.mdx
        priority: MEDIUM
        status: active
      - mistake: A journal of presences without the present option
        mechanism: The default reading expects values in every entry, and the forms of historyFrom for presences only require present to be named, so the call does not compile (TS2769) even when the field is called present.
        wrong_pattern: |
          historyFrom(seen)
        correct_pattern: |
          historyFrom(seen, { present: 'present' })
        source: src/history/index.ts, docs/content/docs/api/history.mdx
        priority: MEDIUM
        status: active
  - name: tanstack-db
    slug: tanstack-db
    domain: data-integrations
    type: composition
    description: "Draw TanStack DB collections as they change, filter and load them at scale, and write positions back."
    covers:
      - "live sources"
      - "subset"
      - "on-demand collections"
      - "live query joins"
      - "persistPositions"
      - "pendingState"
      - "loading status and data.failed"
      - "pointers to persistShapes and showPresence"
      - historyFrom over a collection with present
    tasks:
      - "Draw a collection or a live query as it changes"
      - "Filter a large collection with subset"
      - "Load rows or edges on demand"
      - "Join collections into nodes with a live query"
      - "Write dragged and laid out positions back to a collection"
      - "Show the position writes in flight"
      - "Know when a collection has loaded and show a loading overlay"
    failure_modes:
      - mistake: "A join without getKey"
        mechanism: "A live query with a join keys its rows by the pair of joined keys, so node keys are JSON.stringify([main, joined]) strings that no edge source or target matches and every edge waits."
        wrong_pattern: |
          createLiveQueryCollection({ query: (q) => q.from({ item: items }).innerJoin({ score: scores }, on).select(pick) })
        correct_pattern: |
          createLiveQueryCollection({ getKey: (row) => row.id, query: (q) => q.from({ item: items }).innerJoin({ score: scores }, on).select(pick) })
        source: "docs/content/docs/(guide)/tanstack-db.mdx"
        priority: HIGH
        status: active
      - mistake: "On-demand collection passed as is"
        mechanism: "A subscription without where asks an on-demand collection for every row, so nothing is filtered at the source, and the load of those rows is not tracked: the graph sees the collection as loaded once it is ready, so data.loading and loaded() say nothing about them."
        wrong_pattern: |
          nodes(onDemandItems, { label: 'label' })
        correct_pattern: |
          nodes(subset(onDemandItems, (item) => gte(item.weight, 40)), { label: 'label' })
        source: "docs/content/docs/(guide)/tanstack-db.mdx, src/db/subset.ts"
        priority: HIGH
        status: active
      - mistake: "A new live query where a subset would do"
        mechanism: "A live query collection hands out new row objects on every change, so each node that stays is restyled, while subset keeps the rows of the collection and only the difference moves."
        wrong_pattern: |
          graph.update({ definition: define(createLiveQueryCollection(heavyQuery)) })
        correct_pattern: |
          graph.update({ definition: define(subset(items, (item) => gte(item.weight, minimum))) })
        source: "docs/content/docs/(guide)/tanstack-db.mdx"
        priority: MEDIUM
        status: active
      - mistake: "Key option or wrong field on a live mark"
        mechanism: "A mark of a live source takes the key of the change and no key option, and where and the mark options are checked against the row type."
        wrong_pattern: |
          nodes(items, { key: 'label' })
        correct_pattern: |
          nodes(items, { label: 'label' })
        source: "src/marks.ts, src/db/subset.ts"
        priority: MEDIUM
        status: active
      - mistake: "pendingState not declared"
        mechanism: "persistPositions throws at run time when pendingState is not a free state of the definition, and a typed graph refuses the name."
        wrong_pattern: |
          persistPositions(graph, { collection: items, pendingState: 'saving' })
        correct_pattern: |
          defineGraph({ marks, states: { saving: { outline: 'var(--graph-accent)' } } })
        source: "src/db/index.ts"
        priority: MEDIUM
        status: active
      - mistake: "Expecting persisted positions to follow a layout"
        mechanism: "Positions read from rows are data and a layout never moves them, so a written layout result fixes the nodes."
        source: "docs/content/docs/api/persist-positions.mdx"
        priority: MEDIUM
        status: active
      - mistake: "Mutating a source or its definition in place"
        mechanism: "A subset keeps the where it was built with, so a new filter needs a new subset passed in a new definition to graph.update; row changes need no update."
        wrong_pattern: |
          minimum = 5
        correct_pattern: |
          graph.update({ definition: define(subset(items, (item) => gte(item.weight, 5))) })
        source: "docs/content/docs/(guide)/tanstack-db.mdx"
        priority: MEDIUM
        status: active
      - mistake: "Forgetting to stop persistPositions"
        mechanism: "persistPositions returns a function that removes its listener and flushes the last write, so a graph or component that goes away without calling it leaks the listener and may lose the last move."
        wrong_pattern: |
          useEffect(() => { persistPositions(graph, { collection: items }) }, [graph, items])
        correct_pattern: |
          useEffect(() => persistPositions(graph, { collection: items }), [graph, items])
        source: "docs/content/docs/api/persist-positions.mdx"
        priority: MEDIUM
        status: active
      - mistake: Writing world units into rows that hold degrees
        mechanism: Without longitude and latitude persistPositions writes x and y in world units, which a mark that reads longitude and latitude ignores, so a dragged node never moves in the rows.
        wrong_pattern: |
          persistPositions(graph, { collection: places })
        correct_pattern: |
          persistPositions(graph, { collection: places, longitude: 'lng', latitude: 'lat' })
        source: docs/content/docs/api/persist-positions.mdx, src/db/index.ts
        priority: MEDIUM
        status: active
      - mistake: Writing both surfaces into the same fields
        mechanism: "Canvas positions are in layout units and map positions in the world units of the map, so one pair of fields written for both surfaces flips between two scales and nodes jump when the graph changes side."
        wrong_pattern: |
          persistPositions(graph, { collection, surfaces: ['canvas', 'map'] })
        correct_pattern: |
          persistPositions(graph, { collection, surfaces: ['canvas'] })
          persistPositions(graph, { collection, longitude: 'lng', latitude: 'lat', surfaces: ['map'] })
        source: src/db/index.ts, docs/content/docs/api/persist-positions.mdx
        priority: MEDIUM
        status: active
  - name: tanstack-query
    slug: tanstack-query
