library:
  name: "@bruno00o/graph"
  version: 0.22.0
  repository: https://github.com/bruno00o/graph
  description: Typed graph visualization for any framework, rendered with WebGL2.
  primary_framework: framework-agnostic
domains:
  - name: Graph setup
    slug: graph-setup
    description: Data, keys, marks, the definition, mounting, the instance, states, events and data updates, in plain TypeScript and in React.
  - name: Appearance
    slug: appearance
    description: How nodes, labels and edges look, from scales and themes to edge ends, waypoints, bundling and routing.
  - name: Structure
    slug: structure
    description: The shape of the graph beyond nodes and edges, with groups, merged and hidden elements, layers, support and paths.
  - name: Placement
    slug: placement
    description: Where nodes go, with layouts, positions from data or code, and saved positions.
  - name: Navigation and input
    slug: navigation-and-input
    description: The view, zoom ranges, selection, gestures, keyboard and the states driven by them.
  - name: Geography and time
    slug: geography-and-time
    description: Graphs inside a MapLibre map and graphs that change over a time window.
  - name: Data integrations
    slug: data-integrations
    description: Graphs fed by TanStack DB, TanStack Query, Cypher query results and graph files.
  - name: Tools and output
    slug: tools-and-output
    description: Companions drawn beside or over the graph, and PNG and SVG exports.
skills:
  - name: core
    slug: core
    domain: graph-setup
    type: core
    description: Draw a graph from arrays of items and links, type it, style sets of elements, react to input and replace the data.
    covers:
      - defineGraph
      - nodes
      - edges
      - raw
      - mountGraph
      - GraphInstance
      - states
      - events
      - issues and count
      - live data loading (data, loadingchange, loaded, waitForData)
      - keys and pending edges
      - data updates by identity
    tasks:
      - Draw a graph from an array of items and an array of links without a framework
      - Key nodes and edges that have no id field
      - Map fields to color, size and labels, and set constant colors
      - Type the data so that event targets and datum are typed
      - Fade or highlight a set of nodes by key with a state
      - React to clicks and selection changes
      - Replace the data and keep positions, view and selection
      - Show a loading overlay while live data loads and lay the graph out once on the complete data
      - Find why a graph stays blank, misses edges or does not update
      - Destroy a graph when its page goes away
    failure_modes:
      - mistake: Changing the data array or items in place
        mechanism: The same mark object is not read twice and an item that is the same object counts as unchanged, so push or field assignment changes nothing on screen.
        wrong_pattern: |
          items.push(item)
          graph.update({ definition })
        correct_pattern: |
          items = [...items, item]
          graph.update({ definition: defineGraph({ marks: [nodes(items, itemOptions)] }) })
        source: docs/content/docs/(guide)/data.mdx, src/core/source-table.ts
        priority: HIGH
        status: active
      - mistake: Constant CSS color passed to the color channel
        mechanism: color goes through the color scale, so a CSS color does not compile and a function returning colors draws palette colors.
        wrong_pattern: |
          nodes(items, { color: (item) => item.hex })
        correct_pattern: |
          nodes(items, { fill: (item) => item.hex })
        source: docs/content/docs/(guide)/marks.mdx
        priority: HIGH
        status: active
      - mistake: Container without a height
        mechanism: The graph fills its container and never sizes itself, so a container 0 pixels high draws nothing.
        wrong_pattern: |
          <div id="graph"></div>
        correct_pattern: |
          #graph { height: 480px; }
        source: docs/content/docs/(guide)/installation.mdx
        priority: HIGH
        status: active
      - mistake: Selection changed through graph.states
        mechanism: Built-in states are excluded from graph.states and undeclared names do not compile.
        wrong_pattern: |
          graph.states.set('selected', { nodes: ['n1'] })
        correct_pattern: |
          graph.selection.set({ nodes: ['n1'] })
        source: src/types.ts, docs/content/docs/(guide)/states.mdx
        priority: MEDIUM
        status: active
      - mistake: Item type written on the mark call
        mechanism: Explicit type arguments stop the inference of the literal mark name, so target.mark no longer narrows datum.
        wrong_pattern: |
          nodes<Item>(items, { name: 'item' })
        correct_pattern: |
          const items: Item[] = load()
          nodes(items, { name: 'item' })
        source: docs/content/docs/(guide)/typescript.mdx
        priority: MEDIUM
        status: active
      - mistake: New option functions on every update
        mechanism: Options compare by content but functions by identity, so a new function restyles every item of its mark.
        wrong_pattern: |
          graph.update({ definition: defineGraph({ marks: [nodes(items, { label: (item) => item.name })] }) })
        correct_pattern: |
          const itemOptions = { label: (item: Item) => item.name }
          graph.update({ definition: defineGraph({ marks: [nodes(items, itemOptions)] }) })
        source: docs/content/docs/(guide)/data.mdx
        priority: MEDIUM
        status: active
      - mistake: Laying out or fitting before live data has loaded
        mechanism: A layout run or a fit written right after mounting sees the first batch of a live source only, and drawn() resolves after one frame whether the data is in or not; loaded() waits for the sources, and the automatic layout and fit already wait for them (waitForData).
        wrong_pattern: |
          const graph = mountGraph(el, { definition, ariaLabel })
          await graph.drawn()
          await graph.layout.run(force(), { fit: true })
        correct_pattern: |
          const graph = mountGraph(el, { definition, ariaLabel })
          await graph.loaded()
          await graph.layout.run(force(), { fit: true })
        source: docs/content/docs/(guide)/data.mdx, src/host/data-status.ts
        priority: HIGH
        status: active
      - mistake: Waiting edges taken for a bug
        mechanism: An edge whose end is missing waits for it, uncounted as a problem, so mismatched key types hide edges silently.
        wrong_pattern: |
          edges(links, { source: 'from', target: 'to' })
        correct_pattern: |
          console.log(graph.count().pending, graph.issues())
        source: docs/content/docs/(guide)/data.mdx
        priority: MEDIUM
        status: active
  - name: react
    slug: react
    domain: graph-setup
    type: framework
    description: Render the graph with the Graph component, read and drive it with hooks inside and outside Graph, and control it from React state.
    covers:
      - Graph
      - useGraph
      - useGraphState
      - useGraphEvent
      - Anchor
      - graph option of the hooks
      - controlled props
      - onLoadingChange and data in the state
      - StrictMode
    tasks:
      - Render a graph from props or state without restyling on every render
      - Show a tooltip or overlay over the hovered node
      - Handle clicks with typed event props
      - Show a loading overlay while live sources load
      - Drive the graph from a toolbar or panel outside Graph
      - Control the selection or the view from React state
      - Mount the graph under StrictMode
    failure_modes:
      - mistake: Definition or option functions created in render
        mechanism: A new function restyles every item of its mark on each render and an unmemoized definition reads the whole data again.
        wrong_pattern: |
          <Graph definition={defineGraph({ marks: [nodes(items, { label: (item) => item.name })] })} ariaLabel="Graph" />
        correct_pattern: |
          const definition = useMemo(() => defineGraph({ marks: [nodes(items, itemOptions)] }), [items])
        source: docs/content/docs/(guide)/react.mdx
        priority: HIGH
        status: active
      - mistake: Hooks outside Graph without the graph option
        mechanism: The hooks throw without a Graph or MapGraph above them unless graph is passed, and the ref is null on the first render.
        wrong_pattern: |
          const selected: number = useGraphState((state) => state.selection.nodes.length)
        correct_pattern: |
          const selected = useGraphState((state) => state.selection.nodes.length, { graph }) ?? 0
        source: docs/content/docs/(guide)/react.mdx, src/react/index.tsx
        priority: HIGH
        status: active
      - mistake: Object selector without shallow
        mechanism: useGraphState compares with Object.is, so a selector that builds an object renders on every state change.
        wrong_pattern: |
          useGraphState((state) => ({ count: state.selection.nodes.length }))
        correct_pattern: |
          useGraphState((state) => ({ count: state.selection.nodes.length }), { compare: shallow })
        source: docs/content/docs/(guide)/react.mdx
        priority: HIGH
        status: active
      - mistake: Untyped selectors inside Graph
        mechanism: Components inside Graph cannot see the definition, so datum is unknown without a typed selector parameter.
        wrong_pattern: |
          useGraphState((state) => state.hovered)
        correct_pattern: |
          useGraphState((state: GraphState<string, Marks>) => state.hovered)
        source: docs/content/docs/(guide)/typescript.mdx
        priority: MEDIUM
        status: active
      - mistake: Graph structure read during render
        mechanism: Structure reads apply pending data changes and update the store, which renders other components while React renders.
        wrong_pattern: |
          const near = graph.neighbors(key)
        correct_pattern: |
          useGraphEvent('click', ({ target }) => setNear(target ? graph.neighbors(target.key) : []))
        source: src/host/mount-graph.ts
        priority: MEDIUM
        status: active
      - mistake: Controlled prop set after mount
        mechanism: Controlled mode is decided at mount, so a prop that starts undefined never takes control.
        wrong_pattern: |
          <Graph selection={ready ? selection : undefined} />
        correct_pattern: |
          const [selection, setSelection] = useState<ElementKeysInput>({ nodes: [] })
        source: docs/content/docs/(guide)/react.mdx
        priority: MEDIUM
        status: active
  - name: layouts
    slug: layouts
    domain: placement
    type: sub-skill
    description: Place nodes without coordinates with a layout, run it from code and keep the result.
    covers:
      - force
      - layers
      - grid
      - rings
      - radial
      - geo
      - graph.layout
      - graph.positions
      - Layout
      - relayout
      - autoFit of layouts
      - waitForData
    tasks:
      - Place nodes without coordinates with a force layout
      - Lay out a hierarchy in layers, in a chosen direction
      - Arrange nodes on a grid, in rings, around a root or by longitude and latitude
      - Run a layout from code, follow its progress and fit the result
      - Save positions and restore them
      - Write a custom layout
      - Lay out a graph that arrives in batches from a live source once, on the complete data
    failure_modes:
      - mistake: Importing force from the layouts entry point
        mechanism: force has its own entry point so graphs without it ship none of its code; the layouts entry does not export it.
        wrong_pattern: |
          import { force } from '@bruno00o/graph/layouts'
        correct_pattern: |
          import { force } from '@bruno00o/graph/layouts/force'
        source: docs/content/docs/(guide)/layout.mdx, docs/content/docs/api/force.mdx
        priority: HIGH
        status: active
      - mistake: Expecting a layout to move nodes that have x and y
        mechanism: "Finite x and y channels pin a node: layouts never move it, so a graph whose nodes all have coordinates ignores its layout."
        wrong_pattern: |
          nodes(items, { x: 'x', y: 'y' })
          layout: force()
        correct_pattern: |
          nodes(items, { label: 'label' })
          layout: force()
        source: docs/content/docs/(guide)/layout.mdx, docs/content/docs/(guide)/positions.mdx
        priority: HIGH
        status: active
      - mistake: Running a layout on a map
        mechanism: "Layouts do not run in map mode: the definition layout is ignored with a development warning and graph.layout.run rejects."
        wrong_pattern: |
          await mapGraph.layout.run(force())
        correct_pattern: |
          const flat = defineGraph({ marks, layout: geo({ longitude: 'lng', latitude: 'lat' }) })
        source: docs/content/docs/(guide)/map.mdx, src/host/layout-session.ts
        priority: HIGH
        status: active
      - mistake: grid or rings with order inside defineGraph
        mechanism: TypeScript does not pass the item type of marks to a layout in the same object, so the comparator parameters are unknown.
        wrong_pattern: |
          layout: grid({ order: (a, b) => a.label.localeCompare(b.label) })
        correct_pattern: |
          layout: grid<Item>({ order: (a, b) => a.label.localeCompare(b.label) })
        source: docs/content/docs/(guide)/typescript.mdx, docs/content/docs/api/layouts.mdx
        priority: MEDIUM
        status: active
      - mistake: Expecting an instant layout to be incremental
        mechanism: layers, grid, rings, radial and geo lay out every free node again when nodes arrive, where force places only the new ones.
        wrong_pattern: |
          layout: grid()
        correct_pattern: |
          layout: force()
        source: docs/content/docs/api/layouts.mdx
        priority: MEDIUM
        status: active
      - mistake: Writing positions back on every drag move
        mechanism: positionchange fires on every pointer move during a drag, so saving each one floods the store.
        wrong_pattern: |
          graph.on('positionchange', ({ positions }) => save(positions))
        correct_pattern: |
          graph.on('dragend', ({ keys }) => save(keys.map((key) => [key, graph.positions.get(key)])))
        source: docs/content/docs/(guide)/positions.mdx
        priority: MEDIUM
        status: active
  - name: edges
    slug: edges
    domain: appearance
    type: sub-skill
    description: Shape how edges are drawn, from arrows and labels to ends, waypoints, bundles, routes and bridges.
    covers:
      - arrow
      - dash
      - width
      - flow
      - edge labels
      - ends
      - waypoints
      - lineWaypoints
      - parallel edges
      - loops
      - densityBundling
      - orthogonalRouting
      - bridges
      - graph.bundling
      - graph.routing
      - bundle, route and bridge options
    tasks:
      - Add arrows, dashes, widths, labels and flows to edges
      - Color the two ends of an edge differently
      - Draw edges through waypoints or along line geometries
      - Bundle the edges of a dense graph
      - Route edges in horizontal and vertical segments with bridges over crossings
      - Control parallel edges and loops
    failure_modes:
      - mistake: Setting bundling and routing together
        mechanism: "A definition takes one or the other: defineGraph throws a TypeError at run time and the compiler does not see it."
        wrong_pattern: |
          defineGraph({ marks, bundling: densityBundling(), routing: orthogonalRouting() })
        correct_pattern: |
          defineGraph({ marks, routing: orthogonalRouting(), bridges: true })
        source: docs/content/docs/(guide)/bundling.mdx, docs/content/docs/(guide)/routing.mdx
        priority: HIGH
        status: active
      - mistake: Importing bundling or routing from the main entry
        mechanism: densityBundling and orthogonalRouting have their own entry points; the main entry exports neither.
        wrong_pattern: |
          import { densityBundling } from '@bruno00o/graph'
        correct_pattern: |
          import { densityBundling } from '@bruno00o/graph/bundling'
        source: docs/content/docs/api/bundling.mdx, docs/content/docs/api/routing.mdx
        priority: HIGH
        status: active
      - mistake: Expecting waypoints, geodesic edges or loops to bundle or route
        mechanism: Loops, geodesic edges and edges with waypoints are never bundled or routed, and waypoints and loops are never bridged.
        wrong_pattern: |
          edges(roads, { source: 'from', target: 'to', waypoints: 'via' })
        correct_pattern: |
          edges(links, { source: 'from', target: 'to', bundle: true })
        source: docs/content/docs/(guide)/bundling.mdx, docs/content/docs/(guide)/marks.mdx
        priority: HIGH
        status: active
      - mistake: Passing a constant color to color on edges
        mechanism: color is a channel through the color scale, so a CSS color does not compile.
        wrong_pattern: |
          edges(links, { source: 'from', target: 'to', color: 'tomato' })
        correct_pattern: |
          edges(links, { source: 'from', target: 'to', stroke: 'tomato' })
        source: docs/content/docs/(guide)/marks.mdx
        priority: MEDIUM
        status: active
      - mistake: Expecting a state to style one end of an edge
        mechanism: States and selection hold whole edges, so stroke or strokeWidth in a state recolors both ends.
        wrong_pattern: |
          graph.states.set('hot', { edges: [key] })
        correct_pattern: |
          graph.on('pointerenter', ({ target }) => target.kind === 'edge' && target.end)
        source: docs/content/docs/(guide)/marks.mdx
        priority: MEDIUM
        status: active
      - mistake: Expecting bundles or routes immediately
        mechanism: They are computed in a worker once nodes stand still, edges that arrive later stay straight, and above maxEdges nothing is computed.
        wrong_pattern: |
          graph.update({ definition })
        correct_pattern: |
          await graph.bundling.run()
        source: docs/content/docs/(guide)/bundling.mdx, docs/content/docs/(guide)/routing.mdx
        priority: MEDIUM
        status: active
      - mistake: Edge labels that never show
        mechanism: An edge label shows only when it fits between its nodes and is at least 8 pixels tall on screen.
        wrong_pattern: |
          edges(links, { source: 'from', target: 'to', label: { text: 'name', size: 11 } })
        correct_pattern: |
          graph.view.zoomBy(2)
        source: docs/content/docs/(guide)/labels.mdx
        priority: MEDIUM
        status: active
  - name: groups
    slug: groups
    domain: structure
    type: sub-skill
    description: Nest nodes in groups, fold them, merge edges and hide elements without changing the data.
    covers:
      - parent
      - groups
      - container
      - graph.groups
      - merge
      - aggregate
      - halves
      - betweenGroups
      - hide
      - relayout
      - controlled folded
    tasks:
      - Nest nodes in groups with a parent field
      - Group items by a field with groups()
      - Fold and unfold groups from code or controlled state
      - Merge parallel edges and edges between groups
      - Select and style each direction of a two-way merged edge by its half
      - Hide elements without removing their data
    failure_modes:
      - mistake: Setting halves without directed false
        mechanism: halves only takes effect with directed set to false, and the type accepts the combination and only development builds log a warning once per graph, so the line stays whole, target.direction is never set and a click selects both directions.
        wrong_pattern: |
          edges(links, { source: 'from', target: 'to', merge: { halves: true } })
        correct_pattern: |
          edges(links, { source: 'from', target: 'to', merge: { directed: false, halves: true } })
        source: docs/content/docs/(guide)/transformations.mdx, src/core/projection.ts
        priority: HIGH
        status: active
      - mistake: Passing a string to fold, unfold or set
        mechanism: They take an iterable of keys and a string is an iterable of characters, so the call compiles and folds single characters.
        wrong_pattern: |
          graph.groups.fold('sector-a')
        correct_pattern: |
          graph.groups.fold(['sector-a'])
        source: src/host/graph-instance.ts
        priority: HIGH
        status: active
      - mistake: Building the key of a groups() node by hand
        mechanism: The key of a group node is internal and never collides with a data key, so a guessed key matches nothing.
        wrong_pattern: |
          graph.groups.fold(['sectors:north'])
        correct_pattern: |
          graph.groups.fold([graph.groups.keyOf('sectors', 'north')])
        source: docs/content/docs/(guide)/transformations.mdx, docs/content/docs/api/groups.mdx
        priority: HIGH
        status: active
      - mistake: Expecting folding or merging to relayout
        mechanism: A fold, an unfold or a change of groups() or merge places only the nodes that appear unless relayout is set.
        wrong_pattern: |
          defineGraph({ marks, layout: force() })
        correct_pattern: |
          defineGraph({ marks, layout: force(), relayout: true })
        source: docs/content/docs/(guide)/transformations.mdx
        priority: HIGH
        status: active
      - mistake: Switching to a controlled folded after mount
        mechanism: Folding is controlled or not for the life of the graph, decided at mount by folded.
        wrong_pattern: |
          const graph = mountGraph(el, { definition, ariaLabel })
          graph.update({ folded })
        correct_pattern: |
          mountGraph(el, { definition, ariaLabel, folded: [], onFoldChange })
        source: docs/content/docs/(guide)/groups.mdx
        priority: MEDIUM
        status: active
      - mistake: Rebuilding by functions in render
        mechanism: groups() and merge compare functions by identity, so a new by function regroups every item on each rebuild.
        wrong_pattern: |
          groups(items, { by: (item) => item.sector })
        correct_pattern: |
          const bySector = (item: Item) => item.sector
          groups(items, { by: bySector })
        source: docs/content/docs/api/groups.mdx
        priority: MEDIUM
        status: active
      - mistake: Using hide to shrink the layout
        mechanism: A hidden element stays in layouts, counts and selection; only filtering the data removes it from them.
        wrong_pattern: |
          graph.states.set('off', { nodes })
        correct_pattern: |
          nodes(items.filter(keep), options)
        source: docs/content/docs/(guide)/transformations.mdx
        priority: MEDIUM
        status: active
      - mistake: Expecting merged edges across marks
        mechanism: Edges merge mark by mark, so two marks never share an aggregated edge.
        wrong_pattern: |
          edges(a, { merge: true })
          edges(b, { merge: true })
        correct_pattern: |
          edges([...a, ...b], { merge: true })
        source: docs/content/docs/(guide)/transformations.mdx
        priority: MEDIUM
        status: active
  - name: multilayer
    slug: multilayer
    domain: structure
    type: sub-skill
    description: Put marks in layers, show and hide them, and walk the edges that carry other edges.
    covers:
      - layer
      - graph.layers
      - hiddenLayers
      - supportedBy
      - graph.support
      - createSupportFinder
      - support states of defineGraph
      - drill down with hide
    tasks:
      - Put marks in layers that show and hide at run time
      - Draw the edges of each layer in their own band
      - Walk the edges that carry an edge, and the edges it carries
      - Drill down from one layer to the next
    failure_modes:
      - mistake: Hiding a layer by removing its data
        mechanism: graph.support reads the data in the graph, so removed edges cannot be walked and carriers are reported as missing-carrier.
        wrong_pattern: |
          edges(lowerEdges.filter(isOpen), options)
        correct_pattern: |
          states: { closed: { hide: true } }
        source: docs/content/docs/(guide)/multilayer.mdx
        priority: HIGH
        status: active
      - mistake: Filling the support states yourself
        mechanism: The two states named by support are owned by the graph and replaced at every selection change.
        wrong_pattern: |
          graph.states.set('carrier', walk)
        correct_pattern: |
          graph.states.set('trace', walk)
        source: docs/content/docs/(guide)/multilayer.mdx
        priority: HIGH
        status: active
      - mistake: Naming a support state that is not declared
        mechanism: "support needs free states declared in states: defineGraph throws a TypeError otherwise."
        wrong_pattern: |
          states: { lit: {} }, support: { carriers: 'carrier' }
        correct_pattern: |
          states: { carrier: {} }, support: { carriers: 'carrier' }
        source: src/define-graph.ts, docs/content/docs/(guide)/multilayer.mdx
        priority: HIGH
        status: active
      - mistake: Hiding a node layer and expecting its edges to stay
        mechanism: A hidden node layer hides every edge that ends on its nodes, whatever their layer.
        wrong_pattern: |
          graph.layers.hide(['places'])
        correct_pattern: |
          graph.layers.hide(['routes'])
        source: docs/content/docs/(guide)/multilayer.mdx
        priority: MEDIUM
        status: active
      - mistake: A layer name no mark gives
        mechanism: Literal layer names are checked by graph.layers, but an explicit item type on the mark call loses the inference and every string passes.
        wrong_pattern: |
          edges<Segment>(segments, { layer: 'segments' })
        correct_pattern: |
          edges(segments, { layer: 'segments' })
        source: docs/content/docs/(guide)/multilayer.mdx, docs/content/docs/(guide)/typescript.mdx
        priority: MEDIUM
        status: active
      - mistake: Switching to controlled hiddenLayers after mount
        mechanism: Layer visibility is controlled or not for the life of the graph, decided at mount by hiddenLayers.
        wrong_pattern: |
          graph.update({ hiddenLayers })
        correct_pattern: |
          mountGraph(el, { definition, ariaLabel, hiddenLayers: [], onLayerChange })
        source: docs/content/docs/(guide)/multilayer.mdx
        priority: MEDIUM
        status: active
      - mistake: Walking support with mismatched key types
        mechanism: supportedBy takes edge keys, and 1 and '1' differ, so the carrier is skipped as missing-carrier.
        wrong_pattern: |
          supportedBy: () => 1
        correct_pattern: |
          supportedBy: () => '1'
        source: docs/content/docs/api/support.mdx
        priority: MEDIUM
        status: active
  - name: view
    slug: view
    domain: navigation-and-input
    type: sub-skill
    description: Fit, zoom and move the view, limit it, control it, and show elements by zoom.
    covers:
      - graph.view
      - FitOptions
      - view limits
      - autoFit
      - waitForData
      - controlled view
      - minZoom
      - maxZoom
      - graph.view.toScreen and toWorld
      - view padding
      - level of detail by zoom
    tasks:
      - Fit the view to some nodes or edges
      - Zoom and pan from code with animation
      - Limit the zoom and the viewable area
      - Control the view from application state
      - Convert between screen and world coordinates
      - Show nodes and edges only within a range of zoom
      - Choose what the graph frames on its own with autoFit
      - Frame the complete data of a live source that loads in batches
    failure_modes:
      - mistake: Passing a list of keys to view.fit
        mechanism: fit takes an options object, so a list does not compile and untyped code throws a TypeError.
        wrong_pattern: |
          graph.view.fit(['n1', 'n2'])
        correct_pattern: |
          graph.view.fit({ nodes: ['n1', 'n2'] })
        source: src/host/graph-instance.ts, src/host/mount-graph.ts
        priority: HIGH
        status: active
      - mistake: Updating the view of a graph that is not controlled
        mechanism: update view only moves a graph mounted with view, so on any other graph it does nothing and raises no error.
        wrong_pattern: |
          const graph = mountGraph(container, { definition, ariaLabel: 'Graph' })
          graph.update({ view })
        correct_pattern: |
          const graph = mountGraph(container, { definition, ariaLabel: 'Graph', view, onViewChange })
        source: src/host/mount-graph.ts, docs/content/docs/(guide)/view.mdx
        priority: HIGH
        status: active
      - mistake: Ignoring a request of a controlled view
        mechanism: In controlled mode every gesture is a request that changes nothing until onViewChange answers with update view.
        wrong_pattern: |
          onViewChange: (event) => console.log(event.view)
        correct_pattern: |
          onViewChange: (event) => graph.update({ view: event.view })
        source: docs/content/docs/(guide)/view.mdx
        priority: HIGH
        status: active
      - mistake: Reading the zoom of a mark as the zoom limits of the view
        mechanism: minZoom and maxZoom of a mark decide when an element shows, while those of the view limit where people can zoom, so each does the other job in no way.
        wrong_pattern: |
          nodes(items, { maxZoom: 8 })
        correct_pattern: |
          defineGraph({ marks, view: { maxZoom: 8 } })
        source: src/types.ts, docs/content/docs/(guide)/zoom.mdx
        priority: MEDIUM
        status: active
      - mistake: The same zoom on both sides of a handover
        mechanism: Each mark fades over a quarter of a zoom doubling, so limits that meet at t leave both marks faded out there.
        wrong_pattern: |
          maxZoom: t, minZoom: t
        correct_pattern: |
          maxZoom: t * 2 ** 0.25, minZoom: t / 2 ** 0.25
        source: docs/content/docs/(guide)/zoom.mdx
        priority: MEDIUM
        status: active
      - mistake: Fitting while a layout run is still moving nodes
        mechanism: A fit right after launching a layout run frames the positions of that moment, not the result.
        wrong_pattern: |
          graph.layout.run()
          graph.view.fit()
        correct_pattern: |
          graph.layout.run(undefined, { fit: true })
        source: src/host/graph-instance.ts, docs/content/docs/(guide)/view.mdx
        priority: MEDIUM
        status: active
      - mistake: Setting view limits or padding on a map
        mechanism: On a map the map owns the camera and its limits, so minZoom, maxZoom, bounds, padding and autoFit of the definition change nothing.
        wrong_pattern: |
          defineGraph({ marks, view: { maxZoom: 8 } })
        correct_pattern: |
          map.setMaxZoom(8)
        source: src/map/index.ts, docs/content/docs/(guide)/map.mdx
        priority: MEDIUM
        status: active
  - name: interaction
    slug: interaction
    domain: navigation-and-input
    type: sub-skill
    description: Configure gestures, selection and keyboard, react to pointer events, and style advanced states.
    covers:
      - interaction options
      - selection modes
      - lasso
      - drag
      - wheel
      - touch
      - keyboard
      - focus
      - events
      - others
      - raise
      - hide
      - label always
      - wheel modes and zoomhint
      - autoPan
      - pointer events
      - target.direction of merged edge halves
    tasks:
      - Configure selection, drag, lasso, wheel and touch
      - Control the selection from application state
      - Navigate with the keyboard and manage focus
      - React to clicks, hovers and drags
      - Fade everything outside a state, raise members, or always show their labels
    failure_modes:
      - mistake: Expecting a lasso without both options
        mechanism: The lasso needs lasso true and select multiple, so with select single or without lasso Shift and drag pans the view and selects nothing.
        wrong_pattern: |
          interaction: { select: 'single', lasso: true }
        correct_pattern: |
          interaction: { select: 'multiple', lasso: true }
        source: src/types.ts, docs/content/docs/(guide)/interaction.mdx
        priority: HIGH
        status: active
      - mistake: Controlling the selection without answering requests
        mechanism: In controlled mode a click only calls onSelectionChange, so a handler that does not call update selection leaves the selection frozen.
        wrong_pattern: |
          onSelectionChange: (event) => console.log(event.selection)
        correct_pattern: |
          onSelectionChange: (event) => graph.update({ selection: event.selection })
        source: docs/content/docs/(guide)/interaction.mdx
        priority: HIGH
        status: active
      - mistake: Setting the selection through states
        mechanism: selected, hovered and focused are built in and excluded from graph.states, so a free state name is the only thing it accepts.
        wrong_pattern: |
          graph.states.set('selected', { nodes: ['n1'] })
        correct_pattern: |
          graph.selection.set({ nodes: ['n1'] })
        source: src/host/graph-instance.ts
        priority: MEDIUM
        status: active
      - mistake: A state of edges that fades the nodes
        mechanism: others applies to every element outside the state while it has a member, nodes included, so a state of edges dims all nodes.
        wrong_pattern: |
          states: { route: { stroke: 'red', others: { opacity: 0.2 } } }
        correct_pattern: |
          states: { route: { edges: { stroke: 'red', others: { opacity: 0.2 } } } }
        source: src/types.ts, docs/content/docs/(guide)/states.mdx
        priority: MEDIUM
        status: active
      - mistake: Mixing a style for both kinds with a style by kind
        mechanism: A state style is either for both kinds or by kind, so a style that sets both does not compile.
        wrong_pattern: |
          states: { near: { opacity: 0.2, nodes: { halo: true } } }
        correct_pattern: |
          states: { near: { nodes: { opacity: 0.2, halo: true } } }
        source: src/types.ts
        priority: MEDIUM
        status: active
      - mistake: Turning off pan or zoom and losing keyboard fit
        mechanism: pan false and zoom false also disable the matching keys, so the zero key fits nothing and the view stops following the focused node.
        wrong_pattern: |
          interaction: { pan: false }
        correct_pattern: |
          interaction: { pan: true, zoom: true }
        source: docs/content/docs/(guide)/interaction.mdx
        priority: MEDIUM
        status: active
      - mistake: Expecting the page-scroll hint to come from the graph
        mechanism: In page wheel mode the graph shows no text and only emits zoomhint, so no hint appears until the application shows one.
        wrong_pattern: |
          interaction: { wheel: 'page' }
        correct_pattern: |
          graph.on('zoomhint', ({ key }) => showHint(key))
        source: src/host/events.ts, docs/content/docs/(guide)/interaction.mdx
        priority: MEDIUM
        status: active
      - mistake: Reading the pointer target without narrowing it
        mechanism: Targets are a union on kind and click targets are null over the background, so datum and endpoints need a kind check first.
        wrong_pattern: |
          graph.on('click', ({ target }) => console.log(target.datum))
        correct_pattern: |
          graph.on('click', ({ target }) => { if (target?.kind === 'node') console.log(target.datum) })
        source: src/host/events.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting the graph to own wheel and drag on a map
        mechanism: On a map graph the map owns the camera and its gestures, so the wheel option, the pointer pan and auto-pan do not apply.
        wrong_pattern: |
          interaction: { wheel: 'pan' }
        correct_pattern: |
          map.scrollZoom.disable()
        source: src/map/index.ts, docs/content/docs/(guide)/map.mdx
        priority: MEDIUM
        status: active
  - name: map
    slug: map
    domain: geography-and-time
    type: composition
    description: Draw the graph inside a MapLibre map, by longitude and latitude.
    covers:
      - mountMapGraph
      - MapGraph
      - longitude
      - latitude
      - geodesic
      - globe
      - exportMapPng
      - geoToWorld
      - waypoints
      - lineWaypoints
      - setWorkerUrl with bundlers
    tasks:
      - Draw a graph on a MapLibre map
      - Place nodes by longitude and latitude
      - Draw great circles and routes along a network
      - Switch basemaps and the globe projection
      - Use the map graph in React
      - Export the map and the graph as one PNG
      - Route edges along a network with waypoints
      - Make the map worker load with a bundler
    failure_modes:
      - mistake: Expecting a layout to place nodes on a map
        mechanism: The map layer ignores layout, background, bundling, routing and bridges, and layout.run rejects, so nodes need coordinates.
        wrong_pattern: |
          defineGraph({ marks, layout: force() })
        correct_pattern: |
          nodes(places, { longitude: 'lng', latitude: 'lat' })
        source: src/map/index.ts, docs/content/docs/(guide)/map.mdx
        priority: HIGH
        status: active
      - mistake: Removing the map before the graph
        mechanism: Destroying the graph removes its layer and gives the map gestures back, which needs a live map.
        wrong_pattern: |
          map.remove()
          graph.destroy()
        correct_pattern: |
          graph.destroy()
          map.remove()
        source: src/map/index.ts, docs/content/docs/(guide)/map.mdx
        priority: HIGH
        status: active
      - mistake: Passing a view to a map graph
        mechanism: The map holds the view, so initialView, view and onViewChange are not options of mountMapGraph and update view is ignored.
        wrong_pattern: |
          mountMapGraph(map, { definition, ariaLabel: 'Places', view })
        correct_pattern: |
          mountMapGraph(map, { definition, ariaLabel: 'Places' })
          map.jumpTo({ center: [10, 48], zoom: 4 })
        source: src/map/index.ts, docs/content/docs/api/map.mdx
        priority: HIGH
        status: active
      - mistake: Swapping longitude and latitude
        mechanism: MapLibre takes longitude first and the channels are named, so swapped fields land nodes in the ocean or off the world.
        wrong_pattern: |
          nodes(places, { longitude: 'lat', latitude: 'lng' })
        correct_pattern: |
          nodes(places, { longitude: 'lng', latitude: 'lat' })
        source: src/types.ts, src/core/geo.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting rotation, pitch, lens or minimap on a map
        mechanism: The map stays north up and without pitch, and the lens, the minimap and shapes() marks are not supported on a map graph.
        wrong_pattern: |
          graph.lens.set({ at: pointer })
        correct_pattern: |
          Use the map navigation and leave out the lens and the minimap
        source: src/map/index.ts, docs/content/docs/(guide)/map.mdx
        priority: MEDIUM
        status: active
      - mistake: Colors tuned for one basemap
        mechanism: Colors that read on a light style vanish on a dark one or on imagery, so they must follow the basemap.
        wrong_pattern: |
          nodes(places, { fill: '#ddd' })
        correct_pattern: |
          graph.update({ definition: definitionFor(basemap) })
        source: docs/content/docs/(guide)/map.mdx
        priority: MEDIUM
        status: active
      - mistake: Removing the attribution in an export
        mechanism: exportMapPng writes the attribution of the map and an empty attribution removes it, which most tile licenses forbid.
        wrong_pattern: |
          exportMapPng(graph, { attribution: '' })
        correct_pattern: |
          exportMapPng(graph, { pixelRatio: 2 })
        source: src/map/export.ts
        priority: MEDIUM
        status: active
      - mistake: A map container with no height
        mechanism: MapLibre sizes the map from its container, so a container with no height draws nothing, the graph included.
        wrong_pattern: |
          <div id="map"></div>
        correct_pattern: |
          #map { height: 480px; }
        source: docs/content/docs/(guide)/map.mdx
        priority: MEDIUM
        status: active
  - name: time
    slug: time
    domain: geography-and-time
    type: sub-skill
    description: Give elements a time, show a time window, and add a timeline.
    covers:
      - time channel
      - graph.time
      - time fade
      - createTimeline
      - mountTimeline
      - Timeline
      - useTimeline
      - time window boundaries
      - timeline store and actions
    tasks:
      - Give nodes and edges a time or a period
      - Show only what exists in a time window
      - Fade elements at the edges of the window
      - Add a timeline that brushes, steps and plays
      - Control the time window from state
      - Draw a timeline of your own from its store
    failure_modes:
      - mistake: Giving times as strings
        mechanism: A string is not a time, so the element has no time and always shows, with nothing reported.
        wrong_pattern: |
          nodes(items, { time: 'created' })
        correct_pattern: |
          nodes(items, { time: (item) => Date.parse(item.created) })
        source: src/core/time-range.ts, src/types.ts
        priority: HIGH
        status: active
      - mistake: Expecting the end of a period to be inside the window
        mechanism: Ends are exclusive on both the period and the window, so a period that ends where the window starts does not show.
        wrong_pattern: |
          graph.time.set({ start: t, end: t + 1 })
        correct_pattern: |
          graph.time.set({ start: t, end: t })
        source: docs/content/docs/(guide)/time.mdx, src/core/time-range.ts
        priority: HIGH
        status: active
      - mistake: Controlling the window without both props
        mechanism: Controlled mode is decided at mount by time and never changes, so update time on an uncontrolled graph does nothing and a controlled graph ignores time.set until answered.
        wrong_pattern: |
          mountGraph(container, { definition, ariaLabel: 'Graph' })
          graph.update({ time: window })
        correct_pattern: |
          mountGraph(container, { definition, ariaLabel: 'Graph', time: null, onTimeChange })
        source: src/host/mount-graph.ts, docs/content/docs/(guide)/time.mdx
        priority: HIGH
        status: active
      - mistake: A timeline over data with no times
        mechanism: Without elements that have a time the timeline has no extent and play does nothing.
        wrong_pattern: |
          createTimeline(graph)
        correct_pattern: |
          createTimeline(graph, { extent: { start, end } })
        source: src/timeline/index.ts
        priority: MEDIUM
        status: active
      - mistake: Mixing local and UTC times
        mechanism: Bins and ticks follow the local time zone, so times and window edges written in UTC look one hour or one day off.
        wrong_pattern: |
          graph.time.set({ start: Date.UTC(2024, 0, 1) })
        correct_pattern: |
          graph.time.set({ start: new Date(2024, 0, 1) })
        source: docs/content/docs/api/timeline.mdx
        priority: MEDIUM
        status: active
      - mistake: Fade in the wrong unit
        mechanism: time fade is in the milliseconds of the data, so a duration written in days fades nothing or everything.
        wrong_pattern: |
          defineGraph({ marks, time: { fade: 30 } })
        correct_pattern: |
          defineGraph({ marks, time: { fade: 30 * 86_400_000 } })
        source: src/types.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting the layout to follow the window
        mechanism: Layouts place every node whatever the window and hidden nodes keep their place, so the graph does not rearrange.
        wrong_pattern: |
          graph.time.set(window)
        correct_pattern: |
          Build the data for the window to lay out only what exists then
        source: docs/content/docs/(guide)/time.mdx
        priority: MEDIUM
        status: active
      - mistake: A timeline outside Graph without a graph
        mechanism: The Timeline component and useTimeline read the graph from context, so outside Graph or MapGraph they throw without the graph option.
        wrong_pattern: |
          <Timeline />
        correct_pattern: |
          <Timeline graph={graph} />
        source: src/react/index.tsx, docs/content/docs/api/timeline.mdx
        priority: MEDIUM
        status: active
  - name: tanstack-db
    slug: tanstack-db
    domain: data-integrations
    type: composition
    description: "Draw TanStack DB collections as they change, filter and load them at scale, and write positions back."
    covers:
      - "live sources"
      - "subset"
      - "on-demand collections"
      - "live query joins"
      - "persistPositions"
      - "pendingState"
      - "loading status and data.failed"
    tasks:
      - "Draw a collection or a live query as it changes"
      - "Filter a large collection with subset"
      - "Load rows or edges on demand"
      - "Join collections into nodes with a live query"
      - "Write dragged and laid out positions back to a collection"
      - "Show the position writes in flight"
      - "Know when a collection has loaded and show a loading overlay"
    failure_modes:
      - mistake: "A join without getKey"
        mechanism: "A live query with a join keys its rows by the pair of joined keys, so node keys are JSON.stringify([main, joined]) strings that no edge source or target matches and every edge waits."
        wrong_pattern: |
          createLiveQueryCollection({ query: (q) => q.from({ item: items }).innerJoin({ score: scores }, on).select(pick) })
        correct_pattern: |
          createLiveQueryCollection({ getKey: (row) => row.id, query: (q) => q.from({ item: items }).innerJoin({ score: scores }, on).select(pick) })
        source: "docs/content/docs/(guide)/tanstack-db.mdx"
        priority: HIGH
        status: active
      - mistake: "On-demand collection passed as is"
        mechanism: "A subscription without where asks an on-demand collection for every row, so nothing is filtered at the source, and the load of those rows is not tracked: the graph sees the collection as loaded once it is ready, so data.loading and loaded() say nothing about them."
        wrong_pattern: |
          nodes(onDemandItems, { label: 'label' })
        correct_pattern: |
          nodes(subset(onDemandItems, (item) => gte(item.weight, 40)), { label: 'label' })
        source: "docs/content/docs/(guide)/tanstack-db.mdx, src/db/subset.ts"
        priority: HIGH
        status: active
      - mistake: "A new live query where a subset would do"
        mechanism: "A live query collection hands out new row objects on every change, so each node that stays is restyled, while subset keeps the rows of the collection and only the difference moves."
        wrong_pattern: |
          graph.update({ definition: define(createLiveQueryCollection(heavyQuery)) })
        correct_pattern: |
          graph.update({ definition: define(subset(items, (item) => gte(item.weight, minimum))) })
        source: "docs/content/docs/(guide)/tanstack-db.mdx"
        priority: MEDIUM
        status: active
      - mistake: "Key option or wrong field on a live mark"
        mechanism: "A mark of a live source takes the key of the change and no key option, and where and the mark options are checked against the row type."
        wrong_pattern: |
          nodes(items, { key: 'label' })
        correct_pattern: |
          nodes(items, { label: 'label' })
        source: "src/marks.ts, src/db/subset.ts"
        priority: MEDIUM
        status: active
      - mistake: "pendingState not declared"
        mechanism: "persistPositions throws at run time when pendingState is not a free state of the definition, and a typed graph refuses the name."
        wrong_pattern: |
          persistPositions(graph, { collection: items, pendingState: 'saving' })
        correct_pattern: |
          defineGraph({ marks, states: { saving: { outline: 'var(--graph-accent)' } } })
        source: "src/db/index.ts"
        priority: MEDIUM
        status: active
      - mistake: "Expecting persisted positions to follow a layout"
        mechanism: "Positions read from rows are data and a layout never moves them, so a written layout result fixes the nodes."
        source: "docs/content/docs/api/persist-positions.mdx"
        priority: MEDIUM
        status: active
  - name: tanstack-query
    slug: tanstack-query
    domain: data-integrations
    type: composition
    description: "Explore a graph one neighborhood at a time with TanStack Query."
    covers:
      - "createExploration"
      - "expand"
      - "collapse"
      - "toggle"
      - "retry"
      - "reset"
      - "exploration store"
      - "typing"
      - "loading status of the sources"
    tasks:
      - "Explore a large graph one neighborhood at a time"
      - "Show expanded, loading and failed nodes"
      - "Retry a failed expansion"
      - "Wait for the roots to load before the first layout and fit"
      - "Type the nodes and edges of an exploration"
    failure_modes:
      - mistake: "Expecting the types to be inferred from a plain query object"
        mechanism: "Plain query options are not linked to the node and edge types, so the exploration types its items as { readonly id: Key } and options that read other fields fail to compile; only queryOptions of an adapter infers them."
        wrong_pattern: |
          createExploration(client, { roots, neighbors })
        correct_pattern: |
          createExploration<Person, Relation>(client, { roots, neighbors })
        source: "src/query/index.ts"
        priority: HIGH
        status: active
      - mistake: "Items without an id field and no key option"
        mechanism: "Without nodeKey or edgeKey the item types must have an id field, and function keys read typed items only when neighbors comes first."
        source: "docs/content/docs/api/create-exploration.mdx"
        priority: HIGH
        status: active
      - mistake: "Neighborhood that does not contain the expanded node"
        mechanism: "Only the data of the response gives a node its position, label and color, so a root missing from its own response is not drawn and its edges wait."
        source: "docs/content/docs/(guide)/tanstack-query.mdx, src/query/index.ts"
        priority: HIGH
        status: active
      - mistake: "Creating the exploration in render"
        mechanism: "Each new exploration starts its expansions again and replaces both sources."
        wrong_pattern: |
          const exploration = createExploration<Person, Relation>(client, options)
        correct_pattern: |
          const [exploration] = useState(() => createExploration<Person, Relation>(client, options))
        source: "docs/content/docs/(guide)/tanstack-query.mdx"
        priority: MEDIUM
        status: active
      - mistake: "Writing states from render"
        mechanism: "graph.states.set during a render notifies the store and React warns about updating a component while rendering."
        source: "docs/content/docs/(guide)/tanstack-query.mdx"
        priority: MEDIUM
        status: active
      - mistake: "Errors not shown or retried"
        mechanism: "A failed expansion stays expanded and only exploration.store holds its error, and TanStack Query retries before failing."
        source: "docs/content/docs/(guide)/tanstack-query.mdx"
        priority: MEDIUM
        status: active
      - mistake: "queryKey without the node key"
        mechanism: "Every node then shares one cached neighborhood."
        source: "docs/content/docs/(guide)/tanstack-query.mdx"
        priority: MEDIUM
        status: active
