    domain: data-integrations
    type: sub-skill
    description: "Read and write GraphML, GEXF, JSON Graph Format and CSV."
    covers:
      - "readGraphml"
      - "readGexf"
      - "readJsonGraph"
      - "readJsonGraphs"
      - "readCsv"
      - "detectFormat"
      - "write functions"
      - "FormatError"
      - "issues"
      - "schema"
      - GEXF spells as a list of periods
    tasks:
      - "Read a graph file into nodes and edges"
      - "Map positions, colors, sizes, parents and time of a file onto marks"
      - "Handle unreadable files and data problems"
      - "Write a graph or its positions back to a file format"
      - "Convert between formats"
    failure_modes:
      - mistake: "Mapping x and y and expecting a layout to move them"
        mechanism: "Positions read from the data are never moved by a layout."
        source: "docs/content/docs/(guide)/file-formats.mdx, src/types.ts"
        priority: HIGH
        status: active
      - mistake: "Passing file colors and sizes to the scale"
        mechanism: "color is a channel, so the CSS strings of a file become categories drawn with palette colors unless wrapped in raw()."
        wrong_pattern: |
          nodes(file.nodes, { color: (node) => node.color })
        correct_pattern: |
          nodes(file.nodes, { color: raw((node) => node.color ?? 'var(--graph-node)') })
        source: "docs/content/docs/(guide)/file-formats.mdx"
        priority: HIGH
        status: active
      - mistake: "Passing something other than text to a reader"
        mechanism: "Readers take text (and parsed JSON), not a Response, Blob or Buffer."
        wrong_pattern: |
          readGraphml(await fetch(url))
        correct_pattern: |
          readGraphml(await (await fetch(url)).text())
        source: "docs/content/docs/api/formats.mdx"
        priority: HIGH
        status: active
      - mistake: "Edge mark without source and target"
        mechanism: "The options are required even though the fields of a FileEdge are named source and target."
        source: "src/marks.ts"
        priority: MEDIUM
        status: active
      - mistake: "Ignoring issues"
        mechanism: "A reader never throws for bad data, so a half-read file looks fine while issues lists the skipped and pending parts."
        source: "src/formats/types.ts"
        priority: MEDIUM
        status: active
      - mistake: "Trusting detectFormat on arbitrary text"
        mechanism: "Any text that is not JSON or XML is called csv."
        source: "src/formats/detect.ts"
        priority: MEDIUM
        status: active
      - mistake: "Mixing numeric and string ids"
        mechanism: 'File ids are strings, so edges naming 1 wait for the node with id "1".'
        source: "src/formats/types.ts"
        priority: MEDIUM
        status: active
      - mistake: "Expecting writeCsv to return a string"
        mechanism: "writeCsv returns { nodes, edges }, two texts, and writers throw TypeError for a node without key."
        source: "docs/content/docs/api/formats.mdx"
        priority: MEDIUM
        status: active
      - mistake: Reading only time from elements of several spells
        mechanism: A GEXF element of several spells has time from the start of its first spell to the end of its last, so time alone shows it in the gaps between them.
        wrong_pattern: |
          nodes(file.nodes, { time: 'time' })
        correct_pattern: |
          nodes(file.nodes, { time: (node) => node.spells ?? node.time })
        source: docs/content/docs/(guide)/file-formats.mdx, src/formats/types.ts
        priority: MEDIUM
        status: active
  - name: paths
    slug: paths
    domain: structure
    type: sub-skill
    description: "Find shortest paths and reachable nodes, and highlight them."
    covers:
      - "graph.paths"
      - "createPathFinder"
      - "shortest"
      - "reach"
      - "weights"
      - "direction"
      - "visible"
      - "highlighting"
    tasks:
      - "Find and highlight the shortest path between two nodes"
      - "Find every node within reach of a node"
      - "Keep a search to some nodes and edges"
      - "Search the graph as drawn"
      - "Search paths without mounting a graph"
    failure_modes:
      - mistake: "Weights that are missing or negative"
        mechanism: "An edge whose weight is missing, not a number or infinite cannot be crossed, so the path detours or is null, and a negative weight throws a RangeError."
        wrong_pattern: |
          graph.paths.shortest('a', 'b', { weight: 'minutes' })
        correct_pattern: |
          graph.paths.shortest('a', 'b', { weight: (link) => Math.max(0, Number(link.minutes) || 0) })
        source: "src/types.ts, docs/content/docs/(guide)/paths.mdx"
        priority: HIGH
        status: active
      - mistake: "Reading null or an empty result as a bug"
        mechanism: "shortest returns null for no path, an unknown key or an end that fails the nodes predicate, and reach returns an empty result."
        source: "docs/content/docs/(guide)/paths.mdx"
        priority: HIGH
        status: active
      - mistake: "Expecting a directed search by default"
        mechanism: "Edges are crossed both ways unless direction is forward or backward, whatever arrows are drawn."
        wrong_pattern: |
          graph.paths.shortest('a', 'b')
        correct_pattern: |
          graph.paths.shortest('a', 'b', { direction: 'forward' })
        source: "src/types.ts"
        priority: HIGH
        status: active
      - mistake: "A weight field that does not exist"
        mechanism: "weight is checked against the edge items when marks are typed by inference."
        source: "src/types.ts"
        priority: MEDIUM
        status: active
      - mistake: "A negative or NaN maxCost"
        mechanism: "reach throws a RangeError for a maxCost below 0 or NaN."
        source: "src/core/path-query.ts"
        priority: MEDIUM
        status: active
      - mistake: "Searching the data and expecting what is drawn"
        mechanism: "Without visible a path can cross folded groups and filtered nodes, and its keys put states on elements that are not on screen."
        source: "docs/content/docs/(guide)/paths.mdx"
        priority: MEDIUM
        status: active
      - mistake: "Forgetting destroy on a path finder"
        mechanism: "A finder subscribes to live sources when created."
        source: "src/paths.ts"
        priority: MEDIUM
        status: active
  - name: styling
    slug: styling
    domain: appearance
    type: sub-skill
    description: Style nodes and labels with scales, images, badges, shapes and themes.
    covers:
      - scales
      - labels
      - images
      - badges
      - box shape
      - outlines
      - theme tokens
      - color scale shared with shapes, category order across kinds
      - legend entries for colors set by fill or states
    tasks:
      - Map data values to colors, sizes and widths with scales
      - Style node labels
      - Put images, tinted icons and badges in nodes
      - Draw box nodes that fit their label
      - Theme the graph for light and dark with CSS variables
      - Override a theme token for one graph or one theme
      - Give a node mark scales of its own
    failure_modes:
      - mistake: Expecting a gradient from a numeric color
        mechanism: The color scale is categorical by default, even for numbers, so a numeric color channel draws one palette color per distinct value with no order.
        wrong_pattern: |
          nodes(items, { color: 'score' })
        correct_pattern: |
          defineGraph({
            marks: [nodes(items, { color: 'score' })],
            scales: { color: { type: 'sequential', domain: [0, 100] } },
          })
        source: docs/content/docs/(guide)/scales.mdx
        priority: HIGH
        status: active
      - mistake: A computed pixel size that goes through the scale
        mechanism: A function given to size is a channel, so its result is squeezed into the size range [8, 32] by the square root scale and never draws the pixel diameters it returns.
        wrong_pattern: |
          nodes(items, { size: (item) => item.radius * 2 })
        correct_pattern: |
          nodes(items, { size: raw((item) => item.radius * 2) })
        source: docs/content/docs/(guide)/marks.mdx, src/core/raw.ts
        priority: HIGH
        status: active
      - mistake: A field name in a style
        mechanism: "Styles take a constant or a function, never a field name: a numeric style given a field name does not compile, and a color style given one compiles and is read as a CSS color."
        wrong_pattern: |
          nodes(items, { label: { text: 'name', size: 'weight' } })
        correct_pattern: |
          nodes(items, { label: { text: 'name', size: (item) => item.weight } })
        source: docs/content/docs/(guide)/marks.mdx, src/types.ts
        priority: HIGH
        status: active
      - mistake: A constant color in the color channel
        mechanism: color goes through the color scale, so a CSS color does not compile and a function returning colors draws palette colors.
        wrong_pattern: |
          nodes(items, { color: (item) => item.hex })
        correct_pattern: |
          nodes(items, { color: raw((item) => item.hex) })
        source: docs/content/docs/(guide)/marks.mdx
        priority: HIGH
        status: active
      - mistake: A label that is not a string
        mechanism: Only a non-empty string draws a label, and a function that returns a number does not compile.
        wrong_pattern: |
          nodes(items, { label: (item) => item.count })
        correct_pattern: |
          nodes(items, { label: (item) => String(item.count) })
        source: docs/content/docs/(guide)/labels.mdx
        priority: MEDIUM
        status: active
      - mistake: The theme stylesheet is missing
        mechanism: Every color falls back to its light value without theme.css, so a dark page or a dark class changes nothing.
        wrong_pattern: |
          import '@bruno00o/graph'
        correct_pattern: |
          import '@bruno00o/graph/theme.css'
        source: docs/content/docs/(guide)/theming.mdx
        priority: MEDIUM
        status: active
      - mistake: One image per node
        mechanism: At most 256 distinct images are drawn at once, so the 257th node of a graph with one image each stays plain.
        wrong_pattern: |
          nodes(items, { image: (item) => `/labels/${item.id}.svg` })
        correct_pattern: |
          nodes(items, { image: (item) => `/icons/${item.kind}.svg`, label: 'name' })
        source: docs/content/docs/(guide)/images-and-badges.mdx
        priority: MEDIUM
        status: active
      - mistake: Hard-coded colors that ignore the theme
        mechanism: A hex value is identical in light and dark, so text or fills stay unreadable in one of the themes.
        wrong_pattern: |
          nodes(items, { label: { text: 'name', color: '#222222' } })
        correct_pattern: |
          nodes(items, { label: { text: 'name', color: 'var(--graph-ink)' } })
        source: docs/content/docs/(guide)/theming.mdx
        priority: MEDIUM
        status: active
      - mistake: A tinted icon that is not a single color
        mechanism: The color of an image turns its alpha channel into a mask, so a multicolor picture becomes a flat silhouette.
        wrong_pattern: |
          nodes(items, { image: { src: '/photos/a.jpg', color: 'var(--graph-ink)' } })
        correct_pattern: |
          nodes(items, { image: '/photos/a.jpg' })
        source: docs/content/docs/(guide)/images-and-badges.mdx
        priority: MEDIUM
        status: active
      - mistake: Option functions rebuilt on every update
        mechanism: A scale function or a label option function created on every update is a new option, so every element of its mark is restyled.
        wrong_pattern: |
          graph.update({ definition: defineGraph({ marks: [nodes(items, { label: { text: (item) => item.name } })] }) })
        correct_pattern: |
          const text = (item: Item) => item.name
          graph.update({ definition: defineGraph({ marks: [nodes(items, { label: { text } })] }) })
        source: docs/content/docs/(guide)/data.mdx
        priority: MEDIUM
        status: active
      - mistake: Large nodes covering small ones at one place
        mechanism: Nodes draw in the order they arrived, so a large node that arrived last covers a small one and takes the click, where the order option of nodes draws lower values first.
        wrong_pattern: |
          nodes(places, { size: 'count' })
        correct_pattern: |
          nodes(places, { size: 'count', order: (place) => -place.count })
        source: docs/content/docs/(guide)/marks.mdx, src/types.ts
        priority: MEDIUM
        status: active
      - mistake: A legend that cannot explain colors set by rules
        mechanism: The legend reads the scales, not the styles, so colors from fill, stroke, raw() or states have no category.
        wrong_pattern: |
          nodes(items, { fill: (item) => (item.weight >= 40 ? 'var(--graph-cat-1)' : 'var(--graph-node)') }) with createLegend(graph)
        correct_pattern: |
          const heavy = (item) => item.weight >= 40
          createLegend(graph, { entries: [{ entries: [{ id: 'heavy', label: 'Heavy', swatch, nodes: heavy }] }] })
        source: docs/content/docs/(guide)/minimap-and-legend.mdx
        priority: MEDIUM
        status: active
  - name: tools
    slug: tools
    domain: tools-and-output
    type: sub-skill
    description: Add a minimap, a legend, a lens, anchored HTML, hulls, a background grid or the devtools panel.
    covers:
      - createMinimap
      - Minimap
      - createLegend
      - Legend
      - lens
      - anchors
      - hull
      - background
      - devtools
      - shapes in the legend and the minimap
      - legend entries declared by the application
      - devtools Rendering, Drawing and Pixel ratio lines
    tasks:
      - Add a minimap
      - Add a legend that highlights and filters
      - Magnify a dense region with a lens
      - Pin HTML to nodes and edges
      - Draw hulls around sets of nodes and a background grid
      - Inspect graphs in the TanStack Devtools panel
      - Explain colors set by rules of the application with legend entries
    failure_modes:
      - mistake: A minimap or a lens on a map
        mechanism: "The map owns the camera: while the graph is on a map the minimap is empty and graph.lens.set shows nothing; both come back when the graph moves back to its canvas."
        wrong_pattern: |
          mountMapGraph(map, { definition, ariaLabel })
          createMinimap(graph)
        correct_pattern: |
          mountMapGraph(map, { definition, ariaLabel })
        source: docs/content/docs/(guide)/map.mdx, src/host/lens.ts
        priority: HIGH
        status: active
      - mistake: A legend state that the definition does not declare
        mechanism: "highlight and hidden name free states: an undeclared name does not compile on a typed graph and throws at run time otherwise."
        wrong_pattern: |
          createLegend(graph, { highlight: 'match' })
        correct_pattern: |
          defineGraph({ marks, states: { match: { outline: 'var(--graph-accent)' } } })
          createLegend(graph, { highlight: 'match' })
        source: docs/content/docs/api/legend.mdx
        priority: HIGH
        status: active
      - mistake: A hidden legend state that does not hide
        mechanism: "A hidden state with only an opacity fades the elements of an off item instead of filtering the graph, which needs hide: true."
        wrong_pattern: |
          states: { faded: { opacity: 0.1 } }
        correct_pattern: |
          states: { faded: { opacity: 0.1, hide: true } }
        source: docs/content/docs/(guide)/minimap-and-legend.mdx
        priority: HIGH
        status: active
      - mistake: A hull made from another mark object
        mechanism: A hull matches the nodes of the mark object passed to marks, so a second nodes() call or a mark rebuilt in render encloses nothing.
        wrong_pattern: |
          marks: [nodes(items)],
          hulls: [hull({ nodes: nodes(items), by: 'group' })]
        correct_pattern: |
          const people = nodes(items)
          marks: [people],
          hulls: [hull({ nodes: people, by: 'group' })]
        source: docs/content/docs/api/hull.mdx, src/core/hull-layer.ts
        priority: HIGH
        status: active
      - mistake: when on a point or a state anchor
        mechanism: when needs a node or an edge that can be in a state, so a point or a state target takes none and the types refuse it.
        wrong_pattern: |
          graph.anchors.set(element, { point, when: 'hovered' })
        correct_pattern: |
          graph.anchors.set(element, { node: key, when: 'hovered' })
        source: docs/content/docs/api/graph-instance.mdx, src/host/anchors.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting anchored HTML in an export
        mechanism: Anchors are HTML over the canvas, not part of the scene, so no export draws them.
        wrong_pattern: |
          graph.anchors.set(tooltip, { node: key })
          await exportPng(graph)
        correct_pattern: |
          await exportPng(graph)
        source: docs/content/docs/(guide)/export.mdx
        priority: MEDIUM
        status: active
      - mistake: A minimap with corner null that is never placed
        mechanism: With corner null the minimap leaves its element to you, so nothing shows until minimap.element is added to the page.
        wrong_pattern: |
          createMinimap(graph, { corner: null })
        correct_pattern: |
          panel.append(createMinimap(graph, { corner: null }).element)
        source: docs/content/docs/api/minimap.mdx
        priority: MEDIUM
        status: active
      - mistake: A switch over legend looks without case shapes
        mechanism: A legend of a typed graph with a shape mark lists shape looks and shape mark scales, so an exhaustive switch over kind written for nodes and edges no longer compiles, and an untyped one meets shape looks at run time.
        wrong_pattern: |
          switch (look.kind) { case 'nodes': ...; case 'edges': ...; default: assertNever(look) }
        correct_pattern: |
          switch (look.kind) { case 'nodes': ...; case 'edges': ...; case 'shapes': ... }
        source: src/legend/read.ts, docs/content/docs/api/legend.mdx
        priority: MEDIUM
        status: active
      - mistake: Assuming that a listed category has elements
        mechanism: "A legend category can have counts of zero, a domain value with no element or a value a history gives at other moments, so code that divides by a count or takes the first category must test it or use empty hide."
        wrong_pattern: |
          const first = legend.store.state.color.items[0]
        correct_pattern: |
          createLegend(graph, { empty: 'hide' })
        source: docs/content/docs/(guide)/minimap-and-legend.mdx, src/legend/read.ts
        priority: MEDIUM
        status: active
      - mistake: The lens that never shows
        mechanism: interaction.lens is off by default, and the key is ignored while a text field has the focus.
        wrong_pattern: |
          defineGraph({ marks })
        correct_pattern: |
          defineGraph({ marks, interaction: { lens: true } })
        source: docs/content/docs/(guide)/lens.mdx
        priority: MEDIUM
        status: active
      - mistake: Panel messages created in render
        mechanism: A new messages object passed to GraphDevtoolsPanel mounts the panel again at every render.
        wrong_pattern: |
          <GraphDevtoolsPanel messages={{ title: 'Graph' }} />
        correct_pattern: |
          const messages = { title: 'Graph' }
          <GraphDevtoolsPanel messages={messages} />
        source: docs/content/docs/api/devtools.mdx
        priority: MEDIUM
        status: active
      - mistake: A function as the text of a hull without by
        mechanism: "The function receives the group of one hull of by, so a hull around keys, a mark or a state has none: the types refuse it and no label is drawn."
        wrong_pattern: |
          hull({ nodes: ['a', 'b'], label: ({ value }) => String(value) })
        correct_pattern: |
          hull({ nodes: people, by: 'team', label: ({ value }) => String(value) })
        source: docs/content/docs/api/hull.mdx, src/hulls.ts
        priority: MEDIUM
        status: active
      - mistake: Rules of legend entries made in render
        mechanism: Legend entries compare their rules by identity, so new functions at every render make the legend read every element again.
        wrong_pattern: |
          useLegend({ entries: [{ title: 'Weight', entries: [{ id: 'heavy', label: 'Heavy', swatch, nodes: (item) => item.weight >= 40 }] }] })
        correct_pattern: |
          const entries = [{ title: 'Weight', entries: [{ id: 'heavy', label: 'Heavy', swatch, nodes: heavy }] }]
          useLegend({ entries })
        source: src/legend/entries.ts, docs/content/docs/(guide)/minimap-and-legend.mdx
        priority: MEDIUM
        status: active
      - mistake: A swatch that does not match the graph
        mechanism: The swatch is drawn from its own values, not read from the marks, and a node swatch takes fill where an edge swatch takes color, so color on a node swatch does not compile (TS2353).
        wrong_pattern: |
          swatch: { kind: 'nodes', color: 'var(--graph-cat-1)' }
        correct_pattern: |
          swatch: { kind: 'nodes', fill: 'var(--graph-cat-1)' } with the same color in the fill of the mark
        source: src/legend/entries.ts, docs/content/docs/api/legend.mdx
        priority: MEDIUM
        status: active
      - mistake: A LegendState built by hand without entries
        mechanism: LegendState has a required entries field since 0.30, so a state written by hand for a test or a story does not compile without it.
        wrong_pattern: |
          const state: LegendState = { color, size, width, marks, looks, layers, hovered: null, off: [] }
        correct_pattern: |
          const state: LegendState = { ...rest, entries: [] }
        source: src/legend/index.ts
        priority: LOW
        status: active
  - name: export
    slug: export
    domain: tools-and-output
    type: sub-skill
    description: Save the graph as a PNG image, an SVG document, or an editable draw.io or Visio diagram.
    covers:
      - exportPng
      - exportSvg
      - exportDrawio
      - exportVsdx
      - region
      - pixel ratio
      - labels
      - background
      - default pixel ratio of the PNG export
      - states kept in a diagram
      - what a diagram keeps and leaves out
      - the images option of exportSvg
    tasks:
      - Save the graph as a PNG image
      - Save the graph as an SVG document
      - Export a region at a scale, with a background
      - Save the graph as a draw.io file or a Visio drawing that stays editable
    failure_modes:
      - mistake: Exporting a destroyed graph
        mechanism: An export of a destroyed graph, or of one not made by mountGraph, rejects instead of producing a file.
        wrong_pattern: |
          graph.destroy()
          await exportPng(graph)
        correct_pattern: |
          const png = await exportPng(graph)
          graph.destroy()
        source: docs/content/docs/api/export.mdx, src/host/lifecycle.ts
        priority: HIGH
        status: active
      - mistake: Not awaiting the export
        mechanism: Both functions return promises, and an SVG is a string that needs a Blob of type image/svg+xml to be downloaded.
        wrong_pattern: |
          download(exportPng(graph), 'graph.png')
        correct_pattern: |
          download(await exportPng(graph), 'graph.png')
        source: docs/content/docs/(guide)/export.mdx
        priority: HIGH
        status: active
      - mistake: Expecting a transparent PNG by default
        mechanism: The default background is the paper color of the current theme.
        wrong_pattern: |
          await exportPng(graph)
        correct_pattern: |
          await exportPng(graph, { background: 'transparent' })
        source: docs/content/docs/(guide)/export.mdx
        priority: MEDIUM
        status: active
      - mistake: Mixing up zoom and pixel ratio
        mechanism: zoom rescales the content while pixelRatio only adds pixels, and neither accepts a non-positive or infinite value.
        wrong_pattern: |
          await exportPng(graph, { zoom: 4 })
        correct_pattern: |
          await exportPng(graph, { pixelRatio: 4 })
        source: docs/content/docs/(guide)/export.mdx, src/export/index.ts
        priority: MEDIUM
        status: active
      - mistake: Labels missing in a zoomed-out file
        mechanism: labels visible applies the screen rules, so small and overlapping labels are hidden at a small zoom.
        wrong_pattern: |
          await exportSvg(graph, { region: 'graph' })
        correct_pattern: |
          await exportSvg(graph, { region: 'graph', labels: 'all' })
        source: docs/content/docs/(guide)/export.mdx
        priority: MEDIUM
        status: active
      - mistake: Exporting a graph with no size
        mechanism: A hidden graph or one that measures less than one pixel has nothing to draw, so the export rejects with a RangeError.
        wrong_pattern: |
          container.hidden = true
          await exportPng(graph)
        correct_pattern: |
          await exportPng(graph, { region: 'graph' })
        source: src/export/index.ts
        priority: MEDIUM
        status: active
      - mistake: Passing zoom and size together
        mechanism: size chooses the zoom so that the region fits, so a zoom next to it throws a RangeError, and with size the pixel ratio changes how much of the graph fits, not the number of pixels.
        wrong_pattern: |
          await exportPng(graph, { zoom: 2, size: { width: 640 } })
        correct_pattern: |
          await exportPng(graph, { size: { width: 640 } })
        source: docs/content/docs/(guide)/export.mdx, src/export/size.ts
        priority: MEDIUM
        status: active
      - mistake: A blurry PNG from a graph drawn in software
        mechanism: exportPng takes the pixel ratio the graph draws at by default, which is 1 when WebGL runs in software with pixelRatio 'auto'.
        wrong_pattern: |
          exportPng(graph, { region: 'graph' })
        correct_pattern: |
          exportPng(graph, { region: 'graph', pixelRatio: 2 })
        source: docs/content/docs/api/define-graph.mdx, src/export/index.ts
        priority: MEDIUM
        status: active
      - mistake: Expecting the selection in a diagram
        mechanism: exportDrawio and exportVsdx default to states custom, which keeps the states the definition adds and leaves out selected, hovered and focused, so a node selected on screen shows no selection in the file.
        wrong_pattern: |
          await exportDrawio(graph)
        correct_pattern: |
          await exportDrawio(graph, { states: 'all' })
        source: docs/content/docs/(guide)/export.mdx, src/export/index.ts
        priority: MEDIUM
        status: active
      - mistake: A tiny page from a graph on a map
        mechanism: A diagram has one unit per world unit at zoom 1 and the world of a map is 512 units wide, so a graph on a map gives a page a few hundred units across.
        wrong_pattern: |
          await exportDrawio(mapGraph)
        correct_pattern: |
          await exportDrawio(mapGraph, { size: { width: 2000 } })
        source: docs/content/docs/(guide)/export.mdx
        priority: MEDIUM
        status: active
  - name: shapes
    slug: shapes
    domain: structure
    type: sub-skill
    description: Draw zones, rings, rectangles and lines from your own geometry under the graph, and make them selectable, labeled, pinned to nodes, styled, shown by zoom, time and layer, and drawn on a map.
    covers:
      - shapes
      - geometry forms and units
      - fill, stroke, strokeWidth, dash, opacity, order
      - widthScale and minWidth on strokeWidth
      - pick
      - shape labels and their anchors
      - node pins and pending shapes
      - shapes on a flat map and on the globe
      - shape targets, selection and lasso
      - states by kind and others across kinds
      - minZoom, maxZoom, time and layer on shapes
      - view.fit shapes
      - count shapes and invalid-shape issues
      - shapes in PNG and SVG exports
    tasks:
      - Draw zones, rings, rectangles, lines and polygons with holes under a graph
      - Place GeoJSON polygons and lines next to nodes
      - Let people click and select a zone while a decorative zone ignores the pointer
      - Dim everything outside a selected zone, or dim only the nodes
      - Hide a zone below a zoom, outside a time window or with a layer
      - Label zones and show a label with a state
      - Pin a ring or a halo to a node
      - Draw zones on a MapLibre map
      - Frame a zone and count the shapes drawn
      - Find the shapes whose geometry cannot be drawn
    failure_modes:
      - mistake: Importing shapes from the main entry
        mechanism: shapes lives in its own entry point, so the main entry has the types and no function.
        wrong_pattern: |
          import { shapes } from '@bruno00o/graph'
        correct_pattern: |
          import { shapes } from '@bruno00o/graph/shapes'
        source: docs/content/docs/api/shapes.mdx, src/shapes/index.ts
        priority: HIGH
        status: active
      - mistake: A decorative zone that swallows the pointer
        mechanism: A filled or stroked shape takes clicks, hover and the lasso by default, so a backdrop selects itself instead of clearing the selection. pick belongs to a mark, so decoration and zones are two marks.
        wrong_pattern: |
          shapes([sea])
        correct_pattern: |
          shapes([sea], { pick: false })
        source: docs/content/docs/(guide)/shapes.mdx, src/shapes/pick.ts
        priority: HIGH
        status: active
      - mistake: Mixing degrees and world units
        mechanism: GeoJSON and longitude and latitude points are projected to a world 512 units wide, so a zone in degrees does not land around nodes placed with x and y, nor around a pinned node, and a geometry in world units does not line up with a basemap.
        wrong_pattern: |
          nodes(places, { x: 'x', y: 'y' }) with shapes of GeoJSON polygons
        correct_pattern: |
          nodes(places, { longitude: 'lng', latitude: 'lat' }) with the same GeoJSON polygons
        source: docs/content/docs/(guide)/shapes.mdx, src/core/geo.ts
        priority: HIGH
        status: active
      - mistake: A pin that pins nothing
        mechanism: node pins a shape only when its channel returns a key, so null, undefined or a non-key leaves an ordinary shape drawn at the world coordinates of its geometry, with no warning.
        wrong_pattern: |
          shapes(halos, { node: (halo) => halo.root })
        correct_pattern: |
          shapes(halos.filter((halo) => halo.root !== undefined), { node: 'root' })
        source: src/core/shape-store.ts
        priority: HIGH
        status: active
      - mistake: Label options without a text
        mechanism: label takes a text channel or an object whose text is required, so options alone do not compile, and a text that is empty or not a string draws no label.
        wrong_pattern: |
          shapes(zones, { label: { size: 14 } })
        correct_pattern: |
          shapes(zones, { label: { text: 'title', size: 14 } })
        source: src/types.ts, docs/content/docs/(guide)/shapes.mdx
        priority: HIGH
        status: active
      - mistake: Reading shape counts or keys on a graph without a shape mark
        mechanism: count().shapes and selection.get().shapes exist only when the definition has a shape mark, and shape keys are ignored otherwise.
        wrong_pattern: |
          graph.count().shapes
        correct_pattern: |
          Add a shapes() mark to the definition, or read nodes and edges only
        source: src/host/graph-instance.ts, src/host/events.ts
        priority: MEDIUM
        status: active
      - mistake: Treating every target that is not a node as an edge
        mechanism: With a shape mark, or on an untyped instance, a target may be a shape, so an else after the node case holds shapes and an exhaustive switch needs case shape.
        wrong_pattern: |
          if (target.kind === 'node') return
          console.log(target.endpoints)
        correct_pattern: |
          if (target.kind === 'edge') console.log(target.endpoints)
        source: src/host/events.ts, docs/content/docs/(guide)/typescript.mdx
        priority: MEDIUM
        status: active
      - mistake: Coordinates typed as number[][]
        mechanism: A point is an object or an [x, y] tuple, so data typed number[][][] does not satisfy the geometry channel when the field is named.
        wrong_pattern: |
          type Zone = { id: string; outline: { rings: number[][][] } }
        correct_pattern: |
          type Zone = { id: string; outline: ShapeGeometry }
        source: src/types.ts
        priority: MEDIUM
        status: active
      - mistake: A state for nodes that also dims the zones
        mechanism: A member of any kind activates others for every kind, so a style for both kinds fades nodes, edges and shapes outside the state.
        wrong_pattern: |
          states: { focus: { others: { opacity: 0.2 } } }
        correct_pattern: |
          states: { focus: { nodes: { others: { opacity: 0.2 } } } }
        source: docs/content/docs/(guide)/shapes.mdx, docs/content/docs/(guide)/states.mdx
        priority: MEDIUM
        status: active
      - mistake: Changing a shape in place
        mechanism: The graph reads an item once and a geometry once per object, so pushing into a ring or assigning a field changes nothing on screen.
        wrong_pattern: |
          zones[0].geometry.rings[0].push([450, 0])
        correct_pattern: |
          zones = [{ ...zones[0], geometry: { rings: [[...ring, [450, 0]]] } }, ...zones.slice(1)]
        source: src/core/shape-store.ts
        priority: MEDIUM
        status: active
      - mistake: Using a field name as a color
        mechanism: fill and stroke are styles, so a string is the CSS color itself and never a field of the item.
        wrong_pattern: |
          shapes(zones, { fill: 'tone' })
        correct_pattern: |
          shapes(zones, { fill: (zone) => zone.tone })
        source: src/types.ts
        priority: MEDIUM
        status: active
      - mistake: Looking for a waiting shape in count().shapes or issues()
        mechanism: A pinned shape whose node is not in the data waits and is held by count().pendingShapes, out of count().shapes and out of issues(), so a typo in a node key shows as a shape that never appears.
        wrong_pattern: |
          graph.issues()
        correct_pattern: |
          graph.count().pendingShapes
        source: src/host/data-reads.ts, docs/content/docs/(guide)/shapes.mdx
        priority: MEDIUM
        status: active
      - mistake: World-unit shapes on a map
        mechanism: The world is 512 units wide, so a rectangle 100 units wide covers a fifth of the Earth and a pinned ring of radius 2 spans about 1.4 degrees of longitude; map geometry belongs in degrees, with circle radii in meters.
        wrong_pattern: |
          shapes([{ id: 'zone', geometry: { x: 0, y: 0, width: 100, height: 100 } }])
        correct_pattern: |
          shapes([{ id: 'zone', geometry: { center: { longitude: 2.35, latitude: 48.86 }, radius: 5000 } }])
        source: src/shapes/read.ts, docs/content/docs/(guide)/map.mdx
        priority: MEDIUM
        status: active
  - name: editor
    slug: editor
    domain: structure
    type: sub-skill
    description: Let people draw, move, reshape, copy, reorder, delete and type text into shapes with the pointer and the keys, write the edits back to the data, and show who else is editing.
    covers:
      - createShapeEditor
      - mountShapeEditor
      - ShapeEditor
      - useShapeEditor
      - applyShapeEdits
      - edit and editlost events, hold and pending edits
      - drawing tools, snapping, duplicate, raise and lower
      - undo and redo
      - text in shapes and the text tool
      - shape editing on a map and large edits on the GPU
      - persistShapes
      - showPresence
    tasks:
      - Let people move, reshape and resize zones and write each change back to an array
      - Add a toolbar that draws rectangles, circles, lines, polygons, freehand strokes and text boxes
      - Snap drawn points to a grid, copy shapes and change their drawing order
      - Undo and redo the edits of the editor
      - Type text into a shape and grow its box to fit
      - Edit shapes on a MapLibre map in degrees
      - Save every edit to a TanStack DB collection, during a drag too
      - Show the cursors and selections of the other people editing
    failure_modes:
      - mistake: Creating the editor without its layer
        mechanism: The graph hides the shapes being edited and those waiting for their data, and only the layer of mountShapeEditor draws them, so without it they vanish during a drag.
        wrong_pattern: |
          createShapeEditor(graph, { onEdit })
        correct_pattern: |
          mountShapeEditor(createShapeEditor(graph, { onEdit }))
        source: docs/content/docs/api/editor.mdx, src/editor/view.ts
        priority: HIGH
        status: active
      - mistake: Writing the edits without updating the graph
        mechanism: An array source changes only through graph.update with a new definition, so the proposal stays drawn until hold runs out, then editlost and the shape jumps back.
        wrong_pattern: |
          onEdit: (edits) => { zones = applyShapeEdits(zones, edits) }
        correct_pattern: |
          onEdit: (edits) => { zones = applyShapeEdits(zones, edits); graph.update({ definition: define(zones) }) }
        source: docs/content/docs/(guide)/editing-shapes.mdx, src/editor/editor.ts
        priority: HIGH
        status: active
      - mistake: Changing the items in place
        mechanism: An item that is the same object as before is read as unchanged, so assigning its geometry changes nothing and the edit is lost after hold.
        wrong_pattern: |
          Object.assign(edit.datum, { geometry: edit.geometry })
        correct_pattern: |
          zones = applyShapeEdits(zones, edits)
        source: src/editor/edits.ts, src/core/shape-store.ts
        priority: HIGH
        status: active
      - mistake: Two editors on one graph
        mechanism: A graph has at most one editor, so a second createShapeEditor, a ShapeEditor next to useShapeEditor, or an editor created in an effect without cleanup throws.
        wrong_pattern: |
          <ShapeEditor onEdit={save} /> next to a toolbar that calls useShapeEditor()
        correct_pattern: |
          One useShapeEditor in the toolbar, its state and editor passed down
        source: src/editor/editor.ts, docs/content/docs/api/shape-editor.mdx
        priority: HIGH
        status: active
      - mistake: Listing a mark without a name in marks
        mechanism: marks matches mark names, so an unnamed mark can never be listed; a typed graph refuses any string and an untyped one never edits the mark.
        wrong_pattern: |
          shapes(zones) with createShapeEditor(graph, { marks: ['zones'] })
        correct_pattern: |
          shapes(zones, { name: 'zones' }) with createShapeEditor(graph, { marks: ['zones'] })
        source: src/editor/edits.ts
        priority: HIGH
        status: active
      - mistake: Applying every edit to one array
        mechanism: applyShapeEdits applies the whole batch unless mark is given, so with two shape marks the shapes of one are appended to the other and show twice.
        wrong_pattern: |
          notes = applyShapeEdits(notes, edits)
        correct_pattern: |
          notes = applyShapeEdits(notes, edits, { mark: 'notes' })
        source: src/editor/edits.ts
        priority: HIGH
        status: active
      - mistake: Saving drawn shapes without create
        mechanism: persistShapes writes changes and removals to existing rows, but a drawn or copied shape has no row, so without create it waits and ends in editlost.
        wrong_pattern: |
          persistShapes(editor, { collection: zones })
        correct_pattern: |
          persistShapes(editor, { collection: zones, create: (edit) => ({ id: String(edit.key), geometry: edit.geometry }) })
        source: src/db/persist-shapes.ts, docs/content/docs/api/persist-shapes.mdx
        priority: HIGH
        status: active
      - mistake: Handling the edits twice
        mechanism: onEdit and every edit listener receive the same batch, so writing it in both, or with persistShapes and onEdit, adds each new shape twice.
        wrong_pattern: |
          createShapeEditor(graph, { onEdit: save }).on('edit', ({ edits }) => save(edits))
        correct_pattern: |
          createShapeEditor(graph, { onEdit: save })
        source: src/editor/editor.ts
        priority: MEDIUM
        status: active
      - mistake: A writer of your own that writes only the geometry
        mechanism: Edits also carry order and text, and a mark whose geometry is a function does not read the field applyShapeEdits writes, so those edits are lost after hold.
        wrong_pattern: |
          zones.update(key, (draft) => { draft.geometry = edit.geometry })
        correct_pattern: |
          Write geometry, order and text when they are present, or use persistShapes
        source: src/editor/edits.ts, docs/content/docs/(guide)/editing-shapes.mdx
        priority: MEDIUM
        status: active
      - mistake: raise and lower on a mark that does not read order
        mechanism: raise and lower propose a new order written to the order field, which changes nothing unless the mark reads it through its order option.
        wrong_pattern: |
          shapes(zones, { name: 'zones' })
        correct_pattern: |
          shapes(zones, { name: 'zones', order: 'order' })
        source: docs/content/docs/(guide)/editing-shapes.mdx
        priority: MEDIUM
        status: active
      - mistake: Text on a mark without a matching label
        mechanism: Only a mark with label opens the text input, and applyShapeEdits writes the text field, so a label that reads another field never shows the typed text.
        wrong_pattern: |
          shapes(notes, { name: 'notes', label: 'title' }) with applyShapeEdits(notes, edits)
        correct_pattern: |
          applyShapeEdits(notes, edits, { mark: 'notes', text: 'title' })
        source: src/editor/text.ts, src/editor/edits.ts
        priority: MEDIUM
        status: active
      - mistake: Snapping to the background without a background grid
        mechanism: snap.grid 'background' follows the background grid of the definition, so without one nothing snaps and a development build only warns once; a map never has a background grid.
        wrong_pattern: |
          createShapeEditor(graph, { snap: { grid: 'background' } }) on a graph without background
        correct_pattern: |
          defineGraph({ marks, background: { grid: 'lines' } }) with snap: { grid: 'background' }
        source: src/editor/editor.ts
        priority: MEDIUM
        status: active
      - mistake: Keys that never reach the editor
        mechanism: The editor reads keys through the graph element, so after a click on a toolbar button Delete, Escape, Enter and the shortcuts go to the button.
        wrong_pattern: |
          onClick={() => editor.setTool('polygon')}
        correct_pattern: |
          onClick={() => { editor.setTool('polygon'); graph.element.focus() }}
        source: docs/content/docs/(guide)/editing-shapes.mdx
        priority: MEDIUM
        status: active
      - mistake: Selections of others that never show
        mechanism: showPresence shows selections only in the declared free states presence1 to presence8, so without them only cursors show.
        wrong_pattern: |
          defineGraph({ marks }) with showPresence(graph, options)
        correct_pattern: |
          defineGraph({ marks, states: { presence1: look(1), presence2: look(2) } })
        source: src/db/presence.ts, docs/content/docs/api/show-presence.mdx
        priority: MEDIUM
        status: active
      - mistake: Cursors that land in different places or on the wrong surface
        mechanism: Pointers are written in world units of a surface, so clients whose elements sit at different positions, as after a layout that depends on the client, or who are on another surface, show cursors and selections elsewhere, and a row without a surface shows its cursor everywhere.
        wrong_pattern: |
          A force layout on each client with showPresence
        correct_pattern: |
          Positions in the data, a map, or a layout result written to the data
        source: docs/content/docs/api/show-presence.mdx
        priority: MEDIUM
        status: active
      - mistake: Editing a shape that is hidden
        mechanism: A shape hidden by a layer, the time window, a zoom range or a hide state drops out of state.selected and loses its handles, previews and keyboard edits though it stays in the selection of the graph, and a gesture or text box open on it ends as it hides.
        wrong_pattern: |
          const keys = editor.store.state.selected
        correct_pattern: |
          const keys = graph.selection.get().shapes
        source: src/editor/editor.ts
        priority: MEDIUM
        status: active
  - name: headless
    slug: headless
    domain: tools-and-output
    type: sub-skill
    description: Run a graph without a browser, in Node or a worker, lay it out and write it as SVG, PNG, draw.io or Visio files.
    covers:
      - createGraph
      - GraphCore
      - settled
      - size, theme, measureText and title
      - readFont and text widths
      - exportSvg, exportDrawio and exportVsdx without a page
      - the images option of exportSvg
      - a PNG from the SVG with resvg
      - many extracts on worker threads
      - what a graph without a page lacks
    tasks:
      - Lay out a graph in Node and write it as an SVG file
      - Turn the SVG into a PNG with the same font file the labels were measured with
      - Write many extracts in a row on worker threads
      - Read positions, counts, paths or picks of a graph as numbers
      - Write a draw.io or Visio file from a script
    failure_modes:
      - mistake: Rasterizing the SVG without the font file
        mechanism: resvg draws a label only with a font it has, so with the system fonts off and no font file it draws no text, and with its default it draws the fonts of the machine, which are not the font the graph measured.
        wrong_pattern: |
          new Resvg(svg, { font: { loadSystemFonts: false } })
        correct_pattern: |
          new Resvg(svg, { font: { loadSystemFonts: false, fontFiles: [fontFile], defaultFontFamily: font.family } })
        source: docs/content/docs/(guide)/server-side-extracts.mdx
        priority: HIGH
        status: active
      - mistake: Exporting before the graph has settled
        mechanism: The layout runs in slices of 50 ms after createGraph returns, so an export or a read of positions made straight away sees a layout in progress.
        wrong_pattern: |
          const svg = await exportSvg(graph)
        correct_pattern: |
          await graph.settled()
          const svg = await exportSvg(graph)
        source: docs/content/docs/api/graph-core.mdx
        priority: HIGH
        status: active
      - mistake: Edges that never appear
        mechanism: edges() needs source and target even in a script, so without them the edges wait for ends that no one names, count().pending holds them all and issues() is empty.
        wrong_pattern: |
          edges(links, { arrow: 'target' })
        correct_pattern: |
          edges(links, { source: 'from', target: 'to', arrow: 'target' })
        source: src/marks.ts
        priority: HIGH
        status: active
      - mistake: Calling exportPng on a graph without a page
        mechanism: The PNG export draws in WebGL, so it does not compile for a GraphCore and rejects with a TypeError for a graph made by createGraph.
        wrong_pattern: |
          await exportPng(graph)
        correct_pattern: |
          const svg = await exportSvg(graph)
        source: docs/content/docs/api/export.mdx
        priority: HIGH
        status: active
      - mistake: Boxes that do not fit the drawn text
        mechanism: Without measureText the graph measures with the widths of Arial, so labels drawn in another font overflow their plates; the widths of readFont and its family in the theme make the boxes fit the font that draws them.
        wrong_pattern: |
          createGraph({ definition })
        correct_pattern: |
          createGraph({ definition, theme: { font: font.family }, measureText: font.width })
        source: docs/content/docs/api/read-font.mdx
        priority: MEDIUM
        status: active
      - mistake: Labels missing from a small image
        mechanism: labels visible applies the screen rules, so in a small image of a large graph every label is under 8 pixels and none is written.
        wrong_pattern: |
          await exportSvg(graph, { size: { width: 400 } })
        correct_pattern: |
          await exportSvg(graph, { size: { width: 400 }, labels: 'all' })
        source: docs/content/docs/(guide)/server-side-extracts.mdx
        priority: MEDIUM
        status: active
      - mistake: Pictures that are square or missing
        mechanism: Without a page nothing loads the images of the nodes, exportSvg writes each URL as it is and draws the picture square, and resvg loads only data URLs and local files.
        wrong_pattern: |
          await exportSvg(graph)
        correct_pattern: |
          await exportSvg(graph, { images: async (src) => ({ href: dataUrl(src), width, height }) })
        source: docs/content/docs/api/export.mdx
        priority: MEDIUM
        status: active
      - mistake: Treating a big graph like a page
        mechanism: Layouts, bundling and routing run on the calling thread in slices of 50 ms and never in a worker, so many graphs on one thread share it, and the GPU engine of the force layout never runs.
        wrong_pattern: |
          await Promise.all(jobs.map(extract))
        correct_pattern: |
          new Worker(new URL(import.meta.url), { workerData: share })
        source: docs/content/docs/(guide)/server-side-extracts.mdx
        priority: MEDIUM
        status: active
      - mistake: Waiting for an animation or a frame
        mechanism: A graph without a page has no frame loop and no drawn(), and a duration on view.set, view.fit, layout.run or positions.set ends at once.
        wrong_pattern: |
          graph.view.fit({ duration: 400 })
          await sleep(400)
        correct_pattern: |
          graph.view.fit({ duration: 400 })
          await graph.settled()
        source: docs/content/docs/api/create-graph.mdx
        priority: MEDIUM
        status: active
      - mistake: Keeping a graph after its export
        mechanism: A graph that is not destroyed keeps its data, scene and layout state in memory, so a job that makes one graph per extract grows; after destroy reads return the last state, actions do nothing and settled rejects.
        wrong_pattern: |
          const svg = await exportSvg(graph)
        correct_pattern: |
          const svg = await exportSvg(graph)
          graph.destroy()
        source: docs/content/docs/(guide)/server-side-extracts.mdx
        priority: MEDIUM
        status: active
      - mistake: A size that is not above 0
        mechanism: size takes a finite width and height above 0, and a size that is 0, NaN or Infinity throws a RangeError at creation and in update, which then changes nothing.
        wrong_pattern: |
          createGraph({ definition, size: { width: 0, height: 600 } })
        correct_pattern: |
          createGraph({ definition, size: { width: Math.max(1, width), height: 600 } })
        source: docs/content/docs/api/create-graph.mdx, src/headless/page.ts
        priority: MEDIUM
        status: active
      - mistake: Measuring bold labels with the regular face
        mechanism: readFont reads one face, so every weight gets the widths of that file and bold labels drawn from the bold file are wider than their boxes.
        wrong_pattern: |
          createGraph({ definition, measureText: regular.width })
        correct_pattern: |
          createGraph({ definition, measureText: (text, weight, font) => (weight >= 600 ? bold : regular).width(text, weight, font) })
        source: docs/content/docs/api/read-font.mdx
        priority: MEDIUM
        status: active
tensions:
  - name: Rebuilt definitions against stable identities
    skills:
      - core
      - react
    description: React rebuilds values on every render, while the graph compares mark objects, items and option functions by identity.
    implication: An agent that rebuilds the definition in render with inline functions restyles every item on every render.
cross_references:
  - from: react
    to: core
    reason: Data, marks, states and the instance API are the same in React; the react skill only covers what React changes.
  - from: core
    to: react
    reason: React apps render the graph with Graph instead of mountGraph.
gaps:
  - skill: core
    question: Migration between versions (the upgrading page) has no skill yet.
    context: Agents updating the package across breaking versions would need it; left out of the first plan.
    status: open
  - skill: core
    question: WebGL2 limits and capacity fallbacks have no skill yet.
    context: Since 0.30 the core skill covers the context limit, suspension, software rendering and the pixel ratio (references/rendering.md); the rest of the browser-support guide has none, needed only if agents get it wrong.
    status: open
