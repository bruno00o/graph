      - flow
      - edge labels
      - ends
      - waypoints
      - lineWaypoints
      - parallel edges
      - loops
      - densityBundling
      - orthogonalRouting
      - bridges
    tasks:
      - Add arrows, dashes, widths, labels and flows to edges
      - Color the two ends of an edge differently
      - Draw edges through waypoints or along line geometries
      - Bundle the edges of a dense graph
      - Route edges in horizontal and vertical segments with bridges over crossings
      - Control parallel edges and loops
  - name: groups
    slug: groups
    domain: structure
    type: sub-skill
    description: Nest nodes in groups, fold them, merge edges and hide elements without changing the data.
    covers:
      - parent
      - groups
      - container
      - graph.groups
      - merge
      - aggregate
      - betweenGroups
      - hide
    tasks:
      - Nest nodes in groups with a parent field
      - Group items by a field with groups()
      - Fold and unfold groups from code or controlled state
      - Merge parallel edges and edges between groups
      - Hide elements without removing their data
  - name: multilayer
    slug: multilayer
    domain: structure
    type: sub-skill
    description: Put marks in layers, show and hide them, and walk the edges that carry other edges.
    covers:
      - layer
      - graph.layers
      - hiddenLayers
      - supportedBy
      - graph.support
      - createSupportFinder
    tasks:
      - Put marks in layers that show and hide at run time
      - Draw the edges of each layer in their own band
      - Walk the edges that carry an edge, and the edges it carries
      - Drill down from one layer to the next
  - name: view
    slug: view
    domain: navigation-and-input
