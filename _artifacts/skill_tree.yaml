      pointer; controlling the selection from application state; and styling
      states beyond a basic highlight: fading everything outside a state,
      drawing members above the rest, hiding members, always showing their
      labels, or styling nodes and edges apart. The first graph, plain states
      and event basics are in the core skill; moving the view from code is in
      the view skill.
    sources:
