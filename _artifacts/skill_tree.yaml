library:
  name: "@bruno00o/graph"
  version: 0.22.0
generated_from:
  domain_map: _artifacts/domain_map.yaml
  skill_spec: _artifacts/skill_spec.md
review:
  ignore:
    - .github/**
    - .gitignore
    - .node-version
    - .release-please-manifest.json
    - release-please-config.json
    - CHANGELOG.md
    - LICENSE
    - biome.json
    - pnpm-workspace.yaml
    - tsconfig.json
    - tsdown.config.ts
    - vite.config.ts
    - vitest.config.ts
    - scripts/**
    - examples/**
    - docs/src/**
    - docs/public/**
    - docs/source.config.ts
    - docs/tsconfig.json
    - docs/vite.config.ts
    - src/**/*.test.ts
    - src/**/*.test.tsx
    - src/testing/**
skills:
  - name: core
    slug: core
    domain: graph-setup
    path: skills/core/SKILL.md
    description: >
      Use when drawing nodes and edges in the browser with @bruno00o/graph, with
      or without a framework: turning arrays of items and links into a graph
      with defineGraph, nodes() and edges(), mounting it with mountGraph,
      mapping fields to color, size and labels, typing the data so events and
      targets are typed, highlighting or fading sets of nodes with states,
      reacting to clicks and selection, replacing the data, and finding why a
      graph stays blank, misses edges or does not update. Load it before any
      other skill of this package; React apps load the react skill after it.
    purpose: >
      The setup every task with @bruno00o/graph builds on: data and keys, marks
      and their channels, the definition, mounting, the instance API, states,
      events, data updates and data problems, with the mistakes that leave a
      graph blank, stale or untyped.
    sources:
      - src/index.ts
      - src/define-graph.ts
      - src/marks.ts
      - src/types.ts
      - src/core/raw.ts
      - src/core/issues.ts
      - src/core/source-table.ts
      - src/host/graph-instance.ts
      - src/host/events.ts
      - docs/content/docs/(guide)/installation.mdx
      - docs/content/docs/(guide)/quick-start.mdx
      - docs/content/docs/(guide)/data.mdx
      - docs/content/docs/(guide)/states.mdx
      - docs/content/docs/(guide)/typescript.mdx
      - docs/content/docs/(guide)/vanilla.mdx
      - docs/content/docs/api/define-graph.mdx
      - docs/content/docs/api/mount-graph.mdx
      - docs/content/docs/api/graph-instance.mdx
      - docs/content/docs/api/events.mdx
    requires: []
  - name: react
    slug: react
    domain: graph-setup
    path: skills/react/SKILL.md
    description: >
      Use when showing a @bruno00o/graph graph in a React 19 app: rendering it
      with the <Graph> component, building its definition from props or state
      without restyling on every render, drawing HTML overlays and tooltips over
      it, reading the hovered node, the selection or the view in components,
      handling clicks, driving the graph from a toolbar or side panel elsewhere
      in the page, controlling the selection or the view from React state, and
      mounting under StrictMode. Not for a graph inside a MapLibre map, which
      uses <MapGraph>.
    purpose: >
      The React binding of @bruno00o/graph: the <Graph> component and its props,
      the useGraph, useGraphState and useGraphEvent hooks inside and outside
      <Graph>, typed selectors and handlers, controlled props, and the render
      patterns that keep the graph from restyling or failing.
    sources:
      - src/react/index.tsx
      - src/react/graph.tsx
      - src/react/context.ts
      - docs/content/docs/(guide)/react.mdx
      - docs/content/docs/(guide)/typescript.mdx
      - docs/content/docs/api/graph-component.mdx
      - docs/content/docs/api/hooks.mdx
      - docs/content/docs/api/anchor.mdx
    requires:
      - core
  - name: layouts
    slug: layouts
    domain: placement
    path: skills/layouts/SKILL.md
    description: >
      Use when placing @bruno00o/graph nodes that have no coordinates: choosing
      and adding a force layout, layers for a hierarchy or flow, a grid, rings,
      a radial tree or a geographic layout, running or stopping a layout from
      code, following its progress, framing the result, keeping dragged or
      data-given positions, saving and restoring positions, writing a custom
      layout, or finding why nodes do not move or pile up.
    sources:
      - src/layouts/index.ts
      - src/layouts/force/index.ts
      - src/layouts/layers/index.ts
      - src/layouts/grid.ts
      - src/layouts/rings.ts
      - src/layouts/radial.ts
      - src/layouts/geo.ts
      - src/types.ts
      - src/host/graph-instance.ts
      - docs/content/docs/(guide)/layout.mdx
      - docs/content/docs/(guide)/positions.mdx
      - docs/content/docs/api/force.mdx
      - docs/content/docs/api/layouts.mdx
    requires:
      - core
    purpose: >
      Where nodes go: the five ready-made layouts and when to pick each, the
      definition and run-time ways to start a layout, which nodes a layout may
      move, positions from data and from code, and the mistakes that leave nodes
      on a spiral or still.
  - name: edges
    slug: edges
    domain: appearance
    path: skills/edges/SKILL.md
    description: >
      Use when shaping how @bruno00o/graph draws edges beyond source and target:
      arrows, dashes, widths and colors, edge labels, moving dashes (flows), a
      different look and label at each end of an edge, edges through waypoints
      or along GeoJSON lines, parallel edges and loops, bundling the edges of a
      dense graph, orthogonal routing around nodes, and bridges over crossings.
      Also for finding why edges stay straight, ignore bundling or routing, or
      lose their labels.
    sources:
      - src/types.ts
      - src/marks.ts
      - src/waypoints.ts
      - src/bundling/index.ts
      - src/bundling/density.ts
      - src/routing/index.ts
      - docs/content/docs/(guide)/marks.mdx
      - docs/content/docs/(guide)/labels.mdx
      - docs/content/docs/(guide)/bundling.mdx
      - docs/content/docs/(guide)/routing.mdx
      - docs/content/docs/api/edges.mdx
      - docs/content/docs/api/bundling.mdx
      - docs/content/docs/api/routing.mdx
    requires:
      - core
    purpose: >
      Everything an edge mark can look like and how its geometry is computed:
      the channel and style options of edges(), per-end looks, waypoints, the
      automatic bend of parallel edges, and the bundling, routing and bridges of
      the definition, with their limits and the mistakes that leave edges
      straight or throw at definition time.
  - name: groups
    slug: groups
    domain: structure
    path: skills/groups/SKILL.md
    description: >
      Use when nesting @bruno00o/graph nodes in groups with a parent field or by
      a field value with groups(), styling group containers, folding and
      unfolding groups from code, from a double-click or from React state,
      merging parallel edges or the edges between groups into one, hiding
      elements with a state without removing their data, or finding why a group
      does not fold, a key does not match or the layout ignores a fold.
    sources:
      - src/marks.ts
      - src/types.ts
      - src/host/graph-instance.ts
      - docs/content/docs/(guide)/groups.mdx
      - docs/content/docs/(guide)/transformations.mdx
      - docs/content/docs/api/groups.mdx
    requires:
      - core
    purpose: >
      Groups and the transformations that change what is drawn while the data
      stays as it is: parent channels, containers, spreading, fold and unfold
      (instance and controlled), groups() by a field, merge and aggregate for
      edges, betweenGroups, and hide states, with the key, layout and typing
      mistakes that go with them.
  - name: multilayer
    slug: multilayer
    domain: structure
    path: skills/multilayer/SKILL.md
    description: >
      Use when several kinds of links join the same @bruno00o/graph nodes and
      each kind is a layer: putting marks in layers with the layer option,
      showing and hiding layers from code, a legend or React state, drawing the
      edges of each layer in their own band, declaring which edges carry other
      edges with supportedBy, walking carriers and carried edges with
      graph.support or createSupportFinder, lighting the support of a selection,
      and drilling down from one layer to the next.
    sources:
      - src/support.ts
      - src/types.ts
      - src/host/graph-instance.ts
      - docs/content/docs/(guide)/multilayer.mdx
      - docs/content/docs/api/support.mdx
    requires:
      - core
    purpose: >
      Layers, bands, support and drill down: layer on node and edge marks,
      graph.layers and controlled hidden layers, supportedBy and the support
      walks, the support states of defineGraph, and the hide-state pattern for
      opening edges one level at a time.
  - name: view
    slug: view
    domain: navigation-and-input
    path: skills/view/SKILL.md
    description: >
      Use when framing, zooming or moving the @bruno00o/graph view from code:
      fitting the view to chosen nodes or edges, to a selection or a path,
      animating zoom and pan, choosing what the graph frames on its own (first
      data, layouts or nothing), limiting the zoom and the area people can
      reach, keeping the view in application state, converting between screen
      pixels and world units to place overlays or drop nodes, and showing nodes
      and edges only within a range of zoom (level of detail, clusters that give
      way to members). Gesture options such as the wheel belong to the
      interaction skill; a graph inside a MapLibre map does not use this skill's
      view limits and is covered by the map skill.
    sources:
      - src/types.ts
      - src/define-graph.ts
      - src/host/graph-instance.ts
      - src/host/events.ts
      - src/core/zoom-range.ts
      - docs/content/docs/(guide)/view.mdx
      - docs/content/docs/(guide)/zoom.mdx
      - docs/content/docs/api/graph-instance.mdx
      - docs/content/docs/api/define-graph.mdx
    requires:
      - core
    purpose: >
      The camera of a @bruno00o/graph graph: the view as a center and a zoom,
      fit and its options, the first view and automatic framing, view limits,
      the controlled view, screen and world coordinates, and the minZoom and
      maxZoom ranges of nodes and edges.
  - name: interaction
    slug: interaction
    domain: navigation-and-input
    path: skills/interaction/SKILL.md
    description: >
      Use when configuring how people work with a @bruno00o/graph graph:
      selection modes, node drag, the lasso, what the wheel and a trackpad do
      (zoom, pan or scroll the page), touch, auto-pan, turning gestures off,
      keyboard navigation and focus; reacting to clicks, hovers, drags and the
      pointer; controlling the selection from application state; and styling
      states beyond a basic highlight: fading everything outside a state,
      drawing members above the rest, hiding members, always showing their
      labels, or styling nodes and edges apart. The first graph, plain states
      and event basics are in the core skill; moving the view from code is in
      the view skill.
    sources:
      - src/types.ts
      - src/define-graph.ts
      - src/host/events.ts
      - src/host/graph-instance.ts
      - src/host/keyboard.ts
      - src/core/state-names.ts
      - docs/content/docs/(guide)/interaction.mdx
      - docs/content/docs/(guide)/states.mdx
      - docs/content/docs/api/events.mdx
      - docs/content/docs/api/define-graph.mdx
    requires:
      - core
    purpose: >
      The interaction model of a @bruno00o/graph graph: the interaction options
      of defineGraph, selection and its controlled mode, drag and lasso, wheel,
      touch and keyboard, pointer events and their targets, and the advanced
      state styles others, raise, hide and label always.
  - name: map
    slug: map
    domain: geography-and-time
    path: skills/map/SKILL.md
    description: >
      Use when drawing a @bruno00o/graph graph inside a MapLibre map: placing
      nodes by longitude and latitude, mounting the graph on a map with
      mountMapGraph or MapGraph in React, drawing great circles and routes that
      follow roads or other lines, switching basemaps or the globe projection,
      putting a timeline on a map graph, exporting the map and the graph as one
      PNG, and finding why a layout, minimap, lens, rotation or view option does
      nothing on a map. Not for a plain graph that only uses coordinates without
      a map.
    sources:
      - src/map/index.ts
      - src/map/react.tsx
      - src/map/export.ts
      - src/core/geo.ts
      - src/waypoints.ts
      - src/types.ts
      - docs/content/docs/(guide)/map.mdx
      - docs/content/docs/api/map.mdx
      - docs/content/docs/api/map-graph.mdx
    requires:
      - core
    purpose: >
      The MapLibre adapter of @bruno00o/graph: mountMapGraph and MapGraph, the
      longitude and latitude channels, who owns the camera, projections,
      geodesic edges and waypoints, what a map graph leaves out, exportMapPng,
      and the mistakes that hide the graph or leak the map.
  - name: time
    slug: time
    domain: geography-and-time
    path: skills/time/SKILL.md
    description: >
      Use when giving @bruno00o/graph nodes and edges a time or a period,
