      showing and hiding layers from code, a legend or React state, drawing the
      edges of each layer in their own band, declaring which edges carry other
      edges with supportedBy, walking carriers and carried edges with
      graph.support or createSupportFinder, lighting the support of a selection,
      and drilling down from one layer to the next.
    sources:
