skills:
  - name: core
    slug: core
    domain: graph-setup
    path: skills/core/SKILL.md
    description: >
      Use when drawing nodes and edges in the browser with @bruno00o/graph, with
      or without a framework: turning arrays of items and links into a graph
      with defineGraph, nodes() and edges(), mounting it with mountGraph,
      mapping fields to color, size and labels, typing the data so events and
      targets are typed, highlighting or fading sets of nodes with states,
      reacting to clicks and selection, replacing the data, and finding why a
      graph stays blank, misses edges or does not update. Load it before any
      other skill of this package; React apps load the react skill after it.
    purpose: >
      The setup every task with @bruno00o/graph builds on: data and keys, marks
      and their channels, the definition, mounting, the instance API, states,
      events, data updates and data problems, with the mistakes that leave a
      graph blank, stale or untyped.
    sources:
      - src/index.ts
      - src/define-graph.ts
      - src/marks.ts
      - src/types.ts
      - src/core/raw.ts
      - src/core/issues.ts
      - src/core/source-table.ts
      - src/host/graph-instance.ts
      - src/host/events.ts
      - docs/content/docs/(guide)/installation.mdx
      - docs/content/docs/(guide)/quick-start.mdx
      - docs/content/docs/(guide)/data.mdx
      - docs/content/docs/(guide)/states.mdx
      - docs/content/docs/(guide)/typescript.mdx
      - docs/content/docs/(guide)/vanilla.mdx
      - docs/content/docs/api/define-graph.mdx
      - docs/content/docs/api/mount-graph.mdx
      - docs/content/docs/api/graph-instance.mdx
      - docs/content/docs/api/events.mdx
    requires: []
  - name: react
    slug: react
    domain: graph-setup
    path: skills/react/SKILL.md
    description: >
      Use when showing a @bruno00o/graph graph in a React 19 app: rendering it
      with the <Graph> component, building its definition from props or state
      without restyling on every render, drawing HTML overlays and tooltips over
      it, reading the hovered node, the selection or the view in components,
      handling clicks, driving the graph from a toolbar or side panel elsewhere
      in the page, controlling the selection or the view from React state, and
      mounting under StrictMode. Not for a graph inside a MapLibre map, which
      uses <MapGraph>.
    purpose: >
      The React binding of @bruno00o/graph: the <Graph> component and its props,
      the useGraph, useGraphState and useGraphEvent hooks inside and outside
      <Graph>, typed selectors and handlers, controlled props, and the render
      patterns that keep the graph from restyling or failing.
    sources:
      - src/react/index.tsx
      - src/react/graph.tsx
      - src/react/context.ts
      - docs/content/docs/(guide)/react.mdx
      - docs/content/docs/(guide)/typescript.mdx
      - docs/content/docs/api/graph-component.mdx
      - docs/content/docs/api/hooks.mdx
      - docs/content/docs/api/anchor.mdx
    requires:
      - core
  - name: layouts
    slug: layouts
    domain: placement
    path: skills/layouts/SKILL.md
    description: >
      Use when placing @bruno00o/graph nodes that have no coordinates: choosing
      and adding a force layout, layers for a hierarchy or flow, a grid, rings,
      a radial tree or a geographic layout, running or stopping a layout from
      code, following its progress, framing the result, keeping dragged or
      data-given positions, saving and restoring positions, writing a custom
      layout, or finding why nodes do not move or pile up.
    sources:
      - src/layouts/index.ts
      - src/layouts/force/index.ts
      - src/layouts/layers/index.ts
      - src/layouts/grid.ts
      - src/layouts/rings.ts
      - src/layouts/radial.ts
      - src/layouts/geo.ts
      - src/types.ts
      - src/host/graph-instance.ts
      - docs/content/docs/(guide)/layout.mdx
      - docs/content/docs/(guide)/positions.mdx
      - docs/content/docs/api/force.mdx
      - docs/content/docs/api/layouts.mdx
    requires:
      - core
    purpose: >
      Where nodes go: the five ready-made layouts and when to pick each, the
      definition and run-time ways to start a layout, which nodes a layout may
      move, positions from data and from code, and the mistakes that leave nodes
      on a spiral or still.
  - name: edges
    slug: edges
    domain: appearance
    path: skills/edges/SKILL.md
    description: >
      Use when shaping how @bruno00o/graph draws edges beyond source and target:
      arrows, dashes, widths and colors, edge labels, moving dashes (flows), a
      different look and label at each end of an edge, edges through waypoints
      or along GeoJSON lines, parallel edges and loops, bundling the edges of a
      dense graph, orthogonal routing around nodes, and bridges over crossings.
      Also for finding why edges stay straight, ignore bundling or routing, or
      lose their labels.
    sources:
      - src/types.ts
      - src/marks.ts
      - src/waypoints.ts
      - src/bundling/index.ts
      - src/bundling/density.ts
      - src/routing/index.ts
      - docs/content/docs/(guide)/marks.mdx
      - docs/content/docs/(guide)/labels.mdx
      - docs/content/docs/(guide)/bundling.mdx
      - docs/content/docs/(guide)/routing.mdx
      - docs/content/docs/api/edges.mdx
      - docs/content/docs/api/bundling.mdx
      - docs/content/docs/api/routing.mdx
    requires:
      - core
    purpose: >
      Everything an edge mark can look like and how its geometry is computed:
      the channel and style options of edges(), per-end looks, waypoints, the
      automatic bend of parallel edges, and the bundling, routing and bridges of
      the definition, with their limits and the mistakes that leave edges
      straight or throw at definition time.
  - name: groups
    slug: groups
    domain: structure
    path: skills/groups/SKILL.md
    description: >
      Use when nesting @bruno00o/graph nodes in groups with a parent field or by
