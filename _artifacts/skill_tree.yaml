      unfolding groups from code, from a double-click or from React state,
      merging parallel edges or the edges between groups into one, hiding
      elements with a state without removing their data, or finding why a group
      does not fold, a key does not match or the layout ignores a fold.
    sources:
      - src/marks.ts
      - src/types.ts
      - src/host/graph-instance.ts
      - docs/content/docs/(guide)/groups.mdx
      - docs/content/docs/(guide)/transformations.mdx
      - docs/content/docs/api/groups.mdx
    requires:
      - core
    purpose: >
      Groups and the transformations that change what is drawn while the data
      stays as it is: parent channels, containers, spreading, fold and unfold
      (instance and controlled), groups() by a field, merge and aggregate for
      edges, betweenGroups, and hide states, with the key, layout and typing
      mistakes that go with them.
  - name: multilayer
    slug: multilayer
    domain: structure
    path: skills/multilayer/SKILL.md
    description: >
      Use when several kinds of links join the same @bruno00o/graph nodes and
