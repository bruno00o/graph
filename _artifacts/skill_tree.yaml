skills:
  - name: core
    slug: core
    domain: graph-setup
    path: skills/core/SKILL.md
    description: >
      Use when drawing nodes and edges in the browser with @bruno00o/graph, with
      or without a framework: turning arrays of items and links into a graph
      with defineGraph, nodes() and edges(), mounting it with mountGraph,
      mapping fields to color, size and labels, typing the data so events and
      targets are typed, highlighting or fading sets of nodes with states,
      reacting to clicks and selection, replacing the data, and finding why a
      graph stays blank, misses edges or does not update. Load it before any
      other skill of this package; React apps load the react skill after it.
    purpose: >
      The setup every task with @bruno00o/graph builds on: data and keys, marks
      and their channels, the definition, mounting, the instance API, states,
      events, data updates and data problems, with the mistakes that leave a
      graph blank, stale or untyped.
    sources:
      - src/index.ts
      - src/define-graph.ts
      - src/marks.ts
      - src/types.ts
      - src/core/raw.ts
      - src/core/issues.ts
      - src/core/source-table.ts
      - src/host/graph-instance.ts
      - src/host/events.ts
      - docs/content/docs/(guide)/installation.mdx
      - docs/content/docs/(guide)/quick-start.mdx
      - docs/content/docs/(guide)/data.mdx
      - docs/content/docs/(guide)/states.mdx
      - docs/content/docs/(guide)/typescript.mdx
      - docs/content/docs/(guide)/vanilla.mdx
      - docs/content/docs/api/define-graph.mdx
      - docs/content/docs/api/mount-graph.mdx
      - docs/content/docs/api/graph-instance.mdx
      - docs/content/docs/api/events.mdx
    requires: []
  - name: react
    slug: react
    domain: graph-setup
    path: skills/react/SKILL.md
    description: >
      Use when showing a @bruno00o/graph graph in a React 19 app: rendering it
      with the <Graph> component, building its definition from props or state
      without restyling on every render, drawing HTML overlays and tooltips over
      it, reading the hovered node, the selection or the view in components,
      handling clicks, driving the graph from a toolbar or side panel elsewhere
      in the page, controlling the selection or the view from React state, and
      mounting under StrictMode. Not for a graph inside a MapLibre map, which
      uses <MapGraph>.
    purpose: >
      The React binding of @bruno00o/graph: the <Graph> component and its props,
      the useGraph, useGraphState and useGraphEvent hooks inside and outside
      <Graph>, typed selectors and handlers, controlled props, and the render
      patterns that keep the graph from restyling or failing.
    sources:
      - src/react/index.tsx
      - src/react/graph.tsx
      - src/react/context.ts
      - docs/content/docs/(guide)/react.mdx
      - docs/content/docs/(guide)/typescript.mdx
